<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEDE AÍ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0b1220;color:#fff;padding-bottom:100px}
header{background:#111d33;padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}
h1{font-size:20px}
h1 span{font-size:11px;background:#22c55e;color:#000;padding:3px 8px;border-radius:20px;margin-left:6px}
.search{width:100%;padding:14px 18px;border-radius:999px;background:#15203a;border:1px solid #243043;color:#fff;margin:14px 0}
.wrap{padding:0 14px}
.card{background:#141f36;border:1px solid #22304a;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card img{width:52px;height:52px;border-radius:10px;background:#222}
.t{font-weight:700;font-size:14px}
.a{font-size:12px;color:#94a3b8}
.play{margin-left:auto;background:#22c55e;border:0;width:42px;height:42px;border-radius:50%;font-weight:900}
.del{background:#1e293b;border:0;color:#ff5555;width:32px;height:32px;border-radius:8px;margin-left:6px}
#donoBox{display:none;background:#111d33;border:1px solid #22c55e;border-radius:14px;padding:14px;margin:14px}
#donoBox input{width:100%;padding:12px;border-radius:10px;background:#0b1220;border:1px solid #2a3a5a;color:#fff;margin-top:8px}
#donoBox button.add{width:100%;margin-top:10px;padding:12px;background:#22c55e;color:#000;border:0;border-radius:10px;font-weight:800}
</style>
</head>
<body>
<header><h1>🎵 PEDE AÍ <span id="tag">CLIENTE</span></h1><button onclick="alert(isDono?'Você é o DONO':'Você é o CLIENTE')" style="background:#1e293b;color:#fff;border:0;padding:8px 12px;border-radius:10px">☰</button></header>

<div class="wrap">
<input id="busca" class="search" placeholder="🔍 Buscar música..." oninput="filtrar()">

<div id="donoBox">
<b>🔐 PAINEL DO DONO</b><br><small style="color:#94a3b8">Só você vê isso</small>
<input id="nomeMus" placeholder="Nome da música: ex: Boiadeira">
<input id="nomeArt" placeholder="Artista: ex: Ana Castela">
<button class="add" onclick="add()">+ ADICIONAR MÚSICA</button>
<p style="margin-top:10px;font-size:11px;color:#64748b">Link do cliente:<br><span id="linkC" style="color:#22c55e"></span></p>
</div>

<div id="lista"></div>
</div>

<script>
const isDono = new URLSearchParams(location.search).get('dono')==='TAKI123';
const padrao=[
{t:"Boiadeira",a:"Ana Castela"},
{t:"Nosso Quadro",a:"Ana Castela"},
{t:"Bloqueado",a:"Gusttavo Lima"},
{t:"Traumatizei",a:"Henrique e Juliano"},
{t:"Notificação Preferida",a:"Zé Neto e Cristiano"},
{t:"Envolver",a:"Anitta"},
{t:"Leão",a:"Marília Mendonça"}
];
let musicas = JSON.parse(localStorage.getItem('pedeai')||'null')||padrao;
function salvar(){localStorage.setItem('pedeai',JSON.stringify(musicas))}
function render(lista){
document.getElementById('lista').innerHTML=lista.map((m,i)=>`
<div class="card">
<img src="https://picsum.photos/seed/${i}${m.a}/80">
<div><div class="t">${m.t}</div><div class="a">${m.a}</div></div>
<button class="play" onclick="tocar('${m.t} ${m.a}')">▶</button>
${isDono?`<button class="del" onclick="apagar(${i})">✕</button>`:''}
</div>`).join('');
}
function filtrar(){
let q=document.getElementById('busca').value.toLowerCase();
render(musicas.filter(m=>(m.t+' '+m.a).toLowerCase().includes(q)));
}
function tocar(q){window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(q),'_blank')}
function add(){
let t=document.getElementById('nomeMus').value.trim();
let a=document.getElementById('nomeArt').value.trim();
if(!t) return alert('Digite o nome da música');
musicas.unshift({t,a:a||'Você'});
salvar();render(musicas);
document.getElementById('nomeMus').value='';document.getElementById('nomeArt').value='';
}
function apagar(i){if(confirm('Apagar?')){musicas.splice(i,1);salvar();render(musicas)}}

document.getElementById('tag').innerText=isDono?'DONO 👑':'CLIENTE';
document.getElementById('tag').style.background=isDono?'#f59e0b':'#22c55e';
if(isDono) document.getElementById('donoBox').style.display='block';
document.getElementById('linkC').innerText=location.origin+location.pathname;
render(musicas);
</script>
</body>
</html>
