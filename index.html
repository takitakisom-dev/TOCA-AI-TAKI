<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel - ANDRÉ TAKI</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box} body{background:#0a0a0a;color:#fff;font-family:Arial;padding:8px;margin:0}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-bottom:12px}
h3{color:#00ff88;margin:8px 0 4px;font-size:15px;border-bottom:1px solid #222;padding-bottom:6px}
input,textarea{width:100%;background:#0f0f0f;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:5px 0}
.btn{padding:12px 14px;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin:4px}
.btn-verde{background:#00ff88;color:#000} .btn-azul{background:#00b0ff;color:#fff} .btn-laranja{background:#ff9100;color:#000}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.musica{background:#242424;padding:10px;border-radius:10px;display:flex;justify-content:space-between;margin:5px 0}
.qrbox{background:#fff;padding:10px;border-radius:12px;width:200px;margin:10px auto}
</style>
</head>
<body>
<div class="card">
<h3>👤 MEU CADASTRO COMPLETO (volta como combinamos)</h3>
<div class="grid">
<input id="nomeCompleto" placeholder="Nome completo ex: André Silva">
<input id="nomeArtistico" placeholder="Nome artístico ex: ANDRÉ TAKI">
</div>
<div class="grid">
<input id="whats" placeholder="WhatsApp ex: 553499462882">
<input id="pixKey" placeholder="Chave PIX ex: 3499462882 ou CPF">
</div>
<input id="cidade" placeholder="Cidade ex: Caraguatatuba - SP">
<div style="display:flex;gap:6px">
<button class="btn btn-azul" style="flex:1" onclick="salvarLista()">💾 SALVAR NA LISTA (só aqui)</button>
<button class="btn btn-verde" style="flex:1" onclick="salvarNuvem()">☁️ SALVAR NA NUVEM (pro cliente)</button>
</div>
<span id="msg" style="color:#00ff88;font-size:12px"></span>
<div style="margin-top:8px">
<button class="btn" style="background:#2a2a2a;width:48%" onclick="testarSom()">🔊 TESTAR SOM LINDO</button>
<button class="btn btn-verde" id="btnOn" style="width:48%" onclick="setShow(true)">✅ SHOW LIBERADO</button>
<button class="btn btn-laranja" id="btnOff" style="width:48%;display:none" onclick="setShow(false)">⏸️ PAUSAR</button>
</div>
</div>

<div class="card">
<h3>🎵 REPERTÓRIO - Adicionar nova música com artista</h3>
<div style="display:flex;gap:6px">
<input id="novaMusica" placeholder="Ex: SOMBRA DA MALDADE - CIDADE NEGRA" style="flex:1">
<input id="novoArtista" placeholder="Artista" style="flex:0.6">
</div>
<button class="btn btn-verde" style="width:100%" onclick="adicionarMusica()">➕ ADICIONAR NOVA MÚSICA NA LISTA</button>
<textarea id="repArea" rows="8" placeholder="Lista completa..."></textarea>
<button class="btn btn-azul" style="width:100%" onclick="salvarLista()">💾 SALVAR O QUE ESTOU FAZENDO ALI (NA LISTA)</button>
<h3>Lista (<span id="qtd">0</span>) músicas</h3>
<div id="listaRep"></div>
<div style="text-align:center">
<div class="qrbox"><div id="qrcode"></div></div>
<small id="linkTxt" style="color:#00ff88;word-break:break-all;font-size:10px"></small><br>
<button class="btn" style="background:#fff;color:#000" onclick="copiar()">📋 COPIAR LINK</button>
</div>
</div>

<div class="card"><h3>🔴 AO VIVO - Pedidos</h3><div id="aoVivo"><small>Nenhum...</small></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyD8JftaM8BwYLKa_3TAjHqN1ub151Myvgo",authDomain:"pede-ai-pro.firebaseapp.com",databaseURL:"https://pede-ai-pro-default-rtdb.firebaseio.com",projectId:"pede-ai-pro",storageBucket:"pede-ai-pro.firebasestorage.app",messagingSenderId:"549558191964",appId:"1:549558191964:web:40614401989e404af6a399"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let rep=JSON.parse(localStorage.getItem('taki_rep_final')||'[]');
let cadastro=JSON.parse(localStorage.getItem('taki_cadastro')||'{}');
function getId(){let n=cadastro.nomeArtistico||"ANDRÉ TAKI"; let f=cadastro.whats||"553499462882"; return btoa(n+"|"+f).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');}
function carregarCadastro(){document.getElementById('nomeCompleto').value=cadastro.nomeCompleto||"André Taki"; document.getElementById('nomeArtistico').value=cadastro.nomeArtistico||"ANDRÉ TAKI"; document.getElementById('whats').value=cadastro.whats||"553499462882"; document.getElementById('pixKey').value=cadastro.pix||"3499462882"; document.getElementById('cidade').value=cadastro.cidade||"Caraguatatuba - SP";}
function salvarCadastroObj(){cadastro={nomeCompleto:document.getElementById('nomeCompleto').value, nomeArtistico:document.getElementById('nomeArtistico').value, whats:document.getElementById('whats').value, pix:document.getElementById('pixKey').value, cidade:document.getElementById('cidade').value}; localStorage.setItem('taki_cadastro',JSON.stringify(cadastro));}
function render(){let d=document.getElementById('listaRep'); d.innerHTML=""; rep.forEach((m,i)=>{d.innerHTML+=`<div class="musica"><span>${m}</span><button style="background:#ff1744;color:#fff;border:none;padding:6px 10px;border-radius:8px" onclick="remover(${i})">X</button></div>`}); document.getElementById('qtd').innerText=rep.length; document.getElementById('repArea').value=rep.join('\n');}
function adicionarMusica(){let m=document.getElementById('novaMusica').value.trim(); let a=document.getElementById('novoArtista').value.trim(); if(!m)return; let final=a?`${m} - ${a}`:m; rep.unshift(final); document.getElementById('novaMusica').value=""; document.getElementById('novoArtista').value=""; render(); salvarLista();}
function remover(i){rep.splice(i,1); render(); salvarLista();}
function salvarLista(){salvarCadastroObj(); localStorage.setItem('taki_rep_final',JSON.stringify(rep)); document.getElementById('msg').innerText="✅ Salvo na LISTA local!"; setTimeout(()=>document.getElementById('msg').innerText="",2000); render();}
function salvarNuvem(){
 salvarCadastroObj(); salvarLista();
 document.getElementById('msg').innerText="Salvando na nuvem...";
 let id=getId();
 db.ref('empresas/'+id).set({nome:cadastro.nomeArtistico, nomeCompleto:cadastro.nomeCompleto, fone:cadastro.whats, pix:cadastro.pix, cidade:cadastro.cidade, repertorio:rep, showLiberado:true, atualizado:new Date().toISOString()}).then(()=>{
  document.getElementById('msg').innerText="☁️ SALVO NA NUVEM! CLIENTE ATUALIZADO!";
  let link=`https://takitakisom-dev.github.io/TOCA-AI-TAKI/cliente.html?c=${id}`;
  document.getElementById('qrcode').innerHTML=""; new QRCode(document.getElementById("qrcode"),{text:link,width:180,height:180});
  document.getElementById('linkTxt').innerText=link;
  testarSom();
 });
}
function copiar(){navigator.clipboard.writeText(document.getElementById('linkTxt').innerText); alert('Copiado');}
function testarSom(){let ctx=new (window.AudioContext||window.webkitAudioContext)(); let n=ctx.currentTime; [[523,0],[659,0.1],[784,0.2]].forEach(([f,d])=>{let o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=f; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0,n+d); g.gain.linearRampToValueAtTime(0.4,n+d+0.05); g.gain.exponentialRampToValueAtTime(0.01,n+d+0.6); o.start(n+d); o.stop(n+d+0.6);});}
function setShow(v){db.ref('empresas/'+getId()).update({showLiberado:v}); document.getElementById('btnOn').style.display=v?'none':''; document.getElementById('btnOff').style.display=v?'':'none';}
document.getElementById('repArea').addEventListener('input',e=>{rep=e.target.value.split('\n').filter(s=>s.trim());});
window.onload=()=>{if(rep.length===0){rep=["METADE - ADRIANA CALCANHOTO","EVIDÊNCIAS - CHITÃOZINHO E XORORÓ","ELEVADOR - ANA CAROLINA","SOMBRA DA MALDADE - CIDADE NEGRA"];} carregarCadastro(); render();}
</script>
</body>
</html>
