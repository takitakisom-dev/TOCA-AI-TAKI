<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel - ANDRÉ TAKI</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box} body{background:#0a0a0a;color:#fff;font-family:Arial;padding:8px;margin:0}
.card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:16px;padding:14px;margin-bottom:12px}
h3{color:#00ff88;margin:8px 0}
input,textarea{width:100%;background:#0f0f0f;border:1px solid #333;color:#fff;padding:12px;border-radius:10px;margin:5px 0}
.btn{padding:12px 14px;border:none;border-radius:10px;font-weight:800;cursor:pointer;margin:4px}
.btn-verde{background:#00ff88;color:#000} .btn-azul{background:#00b0ff;color:#fff} .btn-vermelho{background:#ff1744;color:#fff}
.musica{background:#242424;padding:10px;border-radius:10px;display:flex;justify-content:space-between;margin:5px 0}
.qrbox{background:#fff;padding:10px;border-radius:12px;width:200px;margin:10px auto}
.m-vivo{background:#242424;border-left:5px solid #00ff88;padding:12px;margin:8px 0;border-radius:10px}
#alerta{position:fixed;top:10px;left:10px;right:10px;background:#00ff88;color:#000;padding:16px;border-radius:12px;font-weight:800;text-align:center;display:none;z-index:9999}
</style>
</head>
<body>
<div id="alerta">🔔 NOVO PEDIDO!</div>

<div class="card">
<h3>👤 MEU CADASTRO</h3>
<input id="nomeArtistico" value="ANDRÉ TAKI">
<input id="whats" value="553499462882">
<input id="pixKey" value="3499462882" placeholder="Chave PIX que vai aparecer pro cliente">
<div style="display:flex;gap:6px">
<button class="btn btn-azul" style="flex:1" onclick="salvarLista()">💾 LISTA</button>
<button class="btn btn-verde" style="flex:1" onclick="salvarNuvem()">☁️ NUVEM + QR</button>
</div>
<span id="msg" style="color:#00ff88;font-size:12px"></span><br>
<button class="btn btn-verde" onclick="destravarSom()">🔊 ATIVAR SOM ALERTA</button>
</div>

<div class="card">
<h3>🎵 REPERTÓRIO (<span id="qtd">0</span>)</h3>
<div style="display:flex;gap:6px"><input id="novaMusica" placeholder="Ex: SOMBRA DA MALDADE - CIDADE NEGRA" style="flex:1"><button class="btn btn-verde" onclick="adicionarMusica()">➕</button></div>
<textarea id="repArea" rows="6"></textarea>
<div id="listaRep"></div>
<div style="text-align:center"><div class="qrbox"><div id="qrcode"></div></div><small id="linkTxt" style="color:#00ff88;word-break:break-all;font-size:10px"></small></div>
</div>

<div class="card">
<h3>🔴 AO VIVO - Pedidos (só do repertório) <span id="statusAoVivo" style="color:yellow">Conectando...</span></h3>
<div style="display:flex;gap:6px">
<button class="btn btn-vermelho" style="flex:1" onclick="limparPedidos()">🗑️ LIMPAR LISTA DE PEDIDOS</button>
<button class="btn" style="flex:1;background:#2a2a2a" onclick="limparSugestoes()">🗑️ LIMPAR SUGESTÕES</button>
</div>
<div id="aoVivo"><small style="color:#888">Aguardando...</small></div>
<h3 style="color:#ff9100">💡 SUGESTÕES DE MÚSICAS (fora do repertório)</h3>
<div id="sugestoes"><small style="color:#888">Nenhuma sugestão...</small></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD8JftaM8BwYLKa_3TAjHqN1ub151Myvgo",authDomain:"pede-ai-pro.firebaseapp.com",databaseURL:"https://pede-ai-pro-default-rtdb.firebaseio.com",projectId:"pede-ai-pro",storageBucket:"pede-ai-pro.firebasestorage.app",messagingSenderId:"549558191964",appId:"1:549558191964:web:40614401989e404af6a399"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let rep=JSON.parse(localStorage.getItem('taki_rep_final')||'["METADE - ADRIANA CALCANHOTO","EVIDÊNCIAS - CHITÃOZINHO E XORORÓ","SOMBRA DA MALDADE - CIDADE NEGRA"]');
let ultimoId=localStorage.getItem('taki_last_id')||"";
function getId(){let n=document.getElementById('nomeArtistico').value||"ANDRÉ TAKI"; let f=document.getElementById('whats').value||"553499462882"; return btoa(n+"|"+f).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');}
function destravarSom(){let ctx=new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); document.getElementById('msg').innerText="✅ SOM ATIVADO!"; if(Notification&&Notification.permission!=="granted")Notification.requestPermission();}
function testarSom(){try{let ctx=new (window.AudioContext||window.webkitAudioContext)(); let n=ctx.currentTime; [523,659,784,1046].forEach((f,i)=>{let o=ctx.createOscillator(),g=ctx.createGain(); o.frequency.value=f; o.connect(g); g.connect(ctx.destination); g.gain.setValueAtTime(0,n+i*0.1); g.gain.linearRampToValueAtTime(0.4,n+i*0.1+0.05); g.gain.exponentialRampToValueAtTime(0.01,n+i*0.1+0.6); o.start(n+i*0.1); o.stop(n+i*0.1+0.6);});}catch(e){}}
function render(){let d=document.getElementById('listaRep'); d.innerHTML=""; rep.forEach((m,i)=>{d.innerHTML+=`<div class="musica"><span>${m}</span><button style="background:#ff1744;color:#fff;border:none;padding:6px 10px;border-radius:8px" onclick="remover(${i})">X</button></div>`}); document.getElementById('qtd').innerText=rep.length; document.getElementById('repArea').value=rep.join('\n');}
function adicionarMusica(){let m=document.getElementById('novaMusica').value.trim(); if(!m)return; rep.unshift(m); document.getElementById('novaMusica').value=""; render(); salvarLista();}
function remover(i){rep.splice(i,1); render(); salvarLista();}
function salvarLista(){localStorage.setItem('taki_rep_final',JSON.stringify(rep));}
function salvarNuvem(){salvarLista(); let id=getId(); ultimoId=id; localStorage.setItem('taki_last_id',id); let pix=document.getElementById('pixKey').value; let nome=document.getElementById('nomeArtistico').value; let fone=document.getElementById('whats').value; db.ref('empresas/'+id).set({nome,fone,pix,repertorio:rep,showLiberado:true,atualizado:new Date().toISOString()}).then(()=>{document.getElementById('msg').innerText="☁️ SALVO!"; let link=`https://takitakisom-dev.github.io/TOCA-AI-TAKI/cliente.html?c=${id}`; document.getElementById('qrcode').innerHTML=""; new QRCode(document.getElementById("qrcode"),{text:link,width:180,height:180}); document.getElementById('linkTxt').innerText=link; ouvirTudo();});}
function ouvirTudo(){let idParaOuvir=ultimoId||getId(); db.ref('empresas/'+idParaOuvir+'/pedidos').off(); db.ref('empresas/'+idParaOuvir+'/sugestoes').off(); document.getElementById('statusAoVivo').innerText=`Ouvindo ✅`; db.ref('empresas/'+idParaOuvir+'/pedidos').on('child_added',snap=>{let p=snap.val(); mostrarPedido(p); tocarAlerta();}); db.ref('empresas/'+idParaOuvir+'/sugestoes').on('child_added',snap=>{let p=snap.val(); mostrarSugestao(p);});}
function mostrarPedido(p){let div=document.getElementById('aoVivo'); let html=`<div class="m-vivo">🔔 <b>PEDIDO DO REPERTÓRIO</b><br>👤 <b>${p.nome||'Anônimo'}</b> - 💬 ${p.recado||''}<br>🎵 <b style="color:#00ff88">${p.musica}</b><br>💰 ${p.valor}<br><small>⏰ ${p.hora}</small></div>`; div.innerHTML=html+div.innerHTML;}
function mostrarSugestao(p){let div=document.getElementById('sugestoes'); if(div.innerHTML.includes('Nenhuma'))div.innerHTML=""; let html=`<div class="m-vivo" style="border-left-color:#ff9100">💡 <b>SUGESTÃO (fora do rep)</b><br>👤 <b>${p.nome||'Anônimo'}</b> - 💬 ${p.recado||''}<br>🎵 Sugeriu: <b style="color:#ff9100">${p.musica}</b><br><small>⏰ ${p.hora}</small></div>`; div.innerHTML=html+div.innerHTML;}
function tocarAlerta(){let a=document.getElementById('alerta'); a.style.display='block'; setTimeout(()=>a.style.display='none',3000); testarSom(); if(navigator.vibrate)navigator.vibrate([300,100,300]);}
function limparPedidos(){if(!confirm('Limpar TODOS os pedidos ao vivo?'))return; let id=ultimoId||getId(); db.ref('empresas/'+id+'/pedidos').remove().then(()=>{document.getElementById('aoVivo').innerHTML="<small>Lista limpa! ✅</small>";});}
function limparSugestoes(){if(!confirm('Limpar sugestões?'))return; let id=ultimoId||getId(); db.ref('empresas/'+id+'/sugestoes').remove().then(()=>{document.getElementById('sugestoes').innerHTML="<small>Lista limpa! ✅</small>";});}
window.onload=()=>{render(); if(ultimoId){let link=`https://takitakisom-dev.github.io/TOCA-AI-TAKI/cliente.html?c=${ultimoId}`; document.getElementById('qrcode').innerHTML=""; new QRCode(document.getElementById("qrcode"),{text:link,width:180,height:180}); document.getElementById('linkTxt').innerText=link;} ouvirTudo();}
</script>
</body>
</html>
