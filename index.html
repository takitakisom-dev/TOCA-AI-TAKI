<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEDE AI PRO - PAINEL</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;text-align:center;padding:10px}
input,textarea{width:92%;padding:14px;margin:8px;border-radius:10px;border:none;font-size:16px}
button{padding:16px;width:92%;border-radius:12px;border:none;font-weight:bold;font-size:16px;margin:8px;cursor:pointer}
#qrcode{margin:20px auto;background:#fff;padding:15px;width:256px;border-radius:15px}
#link{word-break:break-all;font-size:12px;color:#00ff88}
.card{background:#1e1e1e;padding:15px;border-radius:15px;margin:10px}
</style>
</head>
<body>
<div class="card">
<h2>🎤 PEDE AI PRO - PAINEL</h2>
<input id="nome" value="ANDRÉ TAKI" placeholder="Seu nome artístico">
<input id="fone" value="553499462882" placeholder="Seu WhatsApp com DDD">
<textarea id="repertorio" rows="14" placeholder="Cole seu repertório - 1 por linha"></textarea>
<button onclick="salvar()" style="background:#00ff88;color:#000">💾 SALVAR NA NUVEM E GERAR QR</button>
<div id="status" style="margin:10px;color:#ff0"></div>
</div>
<div class="card">
<p>QR que o cliente escaneia - Já com repertório completo:</p>
<div id="qrcode"></div>
<p id="link"></p>
<button onclick="copiar()" style="background:#fff;color:#000">📋 COPIAR LINK</button>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD8JftaM8BwYLKa_3TAjHqN1ub151Myvgo",
  authDomain: "pede-ai-pro.firebaseapp.com",
  databaseURL: "https://pede-ai-pro-default-rtdb.firebaseio.com",
  projectId: "pede-ai-pro",
  storageBucket: "pede-ai-pro.firebasestorage.app",
  messagingSenderId: "549558191964",
  appId: "1:549558191964:web:40614401989e404af6a399",
  measurementId: "G-YZ6J7Z4EYT"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let linkFinal = "";
function salvar(){
  const nome = document.getElementById('nome').value.trim();
  const fone = document.getElementById('fone').value.trim();
  const lista = document.getElementById('repertorio').value.trim().split('\n').map(s=>s.trim()).filter(s=>s);
  if(lista.length==0){ alert('Coloque seu repertório!'); return; }
  document.getElementById('status').innerText = "Salvando na nuvem...";
  const idEmpresa = btoa(nome + "|" + fone).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');
  db.ref('empresas/' + idEmpresa).set({
    nome: nome,
    fone: fone,
    repertorio: lista,
    atualizado: new Date().toISOString()
  }).then(()=>{
    document.getElementById('status').innerText = "✅ Salvo na nuvem! QR atualizado!";
    linkFinal = `https://akitakisom-dev.github.io/TOCA-AI-TAKI/cliente.html?c=${idEmpresa}`;
    document.getElementById('qrcode').innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {text: linkFinal, width:256, height:256, correctLevel: QRCode.CorrectLevel.H});
    document.getElementById('link').innerText = linkFinal;
    localStorage.setItem('pedeai_repertorio', JSON.stringify(lista));
  }).catch(e=>{
    document.getElementById('status').innerText = "Erro: " + e.message;
  });
}
function copiar(){
  navigator.clipboard.writeText(linkFinal);
  alert('Link copiado!');
}
window.onload = ()=>{
  const salvo = localStorage.getItem('pedeai_repertorio');
  if(salvo){
    document.getElementById('repertorio').value = JSON.parse(salvo).join('\n');
  }
}
</script>
</body>
</html>
