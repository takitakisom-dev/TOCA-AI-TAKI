<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PEDE AÍ V31 PRO - NOVO</title>
<script> // DESTROI CACHE ANTIGO
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(reg=>reg.unregister()));}
if(window.caches){caches.keys().then(k=>k.forEach(n=>caches.delete(n)));}
localStorage.setItem("versao","V31");
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Outfit',system-ui}
body{background:#060a14;color:#fff}
.top{position:sticky;top:0;z-index:50;background:rgba(6,10,20,0.95);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.08);padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px}
.logo span{background:linear-gradient(135deg,#22c55e,#a3e635);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ver{font-size:10px;background:#22c55e;color:#000;padding:3px 8px;border-radius:99px;font-weight:900;margin-left:8px}
.menuBtn{width:44px;height:44px;border-radius:12px;background:#1e293b;border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:20px}
.drawer{position:fixed;inset:0;z-index:100;display:none}.drawer.open{display:block}
.drawerBg{position:absolute;inset:0;background:rgba(0,0,0,0.7)}
.drawerPanel{position:absolute;top:0;right:0;width:88%;max-width:380px;height:100%;background:#0f172a;border-left:1px solid rgba(255,255,255,0.1);padding:20px;overflow:auto}
.card{background:rgba(30,41,59,0.7);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px;margin:12px}
.card-premium{background:linear-gradient(135deg,#1e293b,#0f172a);border:1px solid rgba(34,197,94,0.2)}
.inp{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#fff;margin:6px 0}
.btn{padding:14px;border-radius:14px;border:none;font-weight:800;cursor:pointer}
.btn-green{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;width:100%;padding:18px;font-size:16px}
.btn-dark{background:#1e293b;color:#fff;border:1px solid rgba(255,255,255,0.1);flex:1}
.music{padding:16px;border-radius:16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);margin:8px 0;display:flex;justify-content:space-between}
.cal{padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);text-align:center;font-weight:800;cursor:pointer;flex:1}
.cal
