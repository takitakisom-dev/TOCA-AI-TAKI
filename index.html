<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAGEFLOW PRO</title>
<style>
body{margin:0;font-family:Arial;background:#f2f2f5}
.top{background:#10101e;color:#fff;padding:12px;display:flex;gap:8px;align-items:center;position:sticky;top:0;z-index:10}
.top b{flex:1}
.card{background:#fff;margin:10px;border-radius:12px;padding:10px;border:1px solid #000}
.dia{font-size:22px;font-weight:900;color:#0B3D91}
.linha{display:flex;gap:5px;margin-top:6px;align-items:center;font-weight:700;font-size:12px}
.linha b{width:28px}
select{flex:1;padding:8px;border-radius:8px;border:1px solid #ccc;font-weight:700}
.turno{width:60px;background:#EFE8FF;border-color:#7C5CFC;color:#4A2AC0;font-weight:900;text-align:center}
.menu{display:flex;gap:6px;padding:10px;background:#fff;flex-wrap:wrap;position:sticky;top:56px;z-index:9}
.menu button{padding:10px;border:none;border-radius:8px;font-weight:800;background:#eee}
.menu button.on{background:#10101e;color:#fff}
.sec{display:none}.sec.show{display:block}
</style>
</head>
<body>

<div class="top"><b>STAGEFLOW PRO • NOV 2026 • 1 AO 30</b><button onclick="go('rel')" style="padding:8px 12px;border-radius:8px;border:none;background:#7CFF9A;font-weight:800">📊 Relatório</button></div>

<div class="menu">
<button id="b-cal" class="on" onclick="go('cal')">📅 Calendário</button>
<button id="b-rel" onclick="go('rel')">📊 Relatório Artista</button>
<button id="b-art" onclick="go('art')">🎤 Artistas</button>
</div>

<div id="sec-cal" class="sec show">
<div id="cal"></div>
</div>

<div id="sec-rel" class="sec">
<div class="card">
<select id="selArt" style="width:100%;padding:12px"></select>
<button onclick="rel()" style="width:100%;margin-top:8px;padding:12px;border:none;border-radius:8px;background:#0A7A2A;color:#fff;font-weight:900">VER RELATÓRIO DO ANDRÉ</button>
</div>
<div id="resRel"></div>
</div>

<div id="sec-art" class="sec">
<div class="card">
<input id="nomeArt" placeholder="Nome ex: ANDRÉ" style="width:100%;padding:12px;border-radius:8px;border:1px solid #ccc">
<button onclick="addArt()" style="width:100%;margin-top:8px;padding:12px;border:none;border-radius:8px;background:#7C5CFC;color:#fff;font-weight:900">SALVAR</button>
<div id="listaArt" style="margin-top:10px"></div>
</div>
</div>

<script>
let artistas = ["ANDRÉ","Eli","Grill","Luciano","Y Gon","Israel","Vago"];
let casas = ["Cais","Vila Chopp","Grill","Bar do Zé","Omau","Vago"];

function go(id){
 document.querySelectorAll('.sec').forEach(s=>s.classList.remove('show'));
 document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));
 document.getElementById('sec-'+id).classList.add('show');
 document.getElementById('b-'+id).classList.add('on');
 if(id=='cal') monta();
 if(id=='rel') montaSel();
 if(id=='art') listaArt();
}

function monta(){
 let cal=document.getElementById('cal');
 cal.innerHTML='';
 for(let d=1;d<=30;d++){
   let html=`<div class="card"><div class="dia">${d} ▼ - Dia ${d}</div>`;
   for(let p=0;p<6;p++){
     html+=`<div class="linha"><b>P${p+1}:</b><select id="d${d}p${p}">${artistas.map(a=>`<option ${a=='ANDRÉ'?'selected':''}>${a}</option>`).join('')}</select><select class="turno" id="d${d}p${p}t"><option>AL</option><option>JA</option><option>AL/JA</option></select></div>`;
   }
   html+=`</div>`;
   cal.innerHTML+=html;
 }
}

function montaSel(){
 document.getElementById('selArt').innerHTML=artistas.map(a=>`<option>${a}</option>`).join('');
}
function rel(){
 let nome=document.getElementById('selArt').value;
 let dias=[];
 for(let d=1;d<=30;d++){
   for(let p=0;p<6;p++){
     let el=document.getElementById(`d${d}p${p}`);
     if(el && el.value==nome) if(!dias.includes(d)) dias.push(d);
   }
 }
 dias.sort((a,b)=>a-b);
 document.getElementById('resRel').innerHTML=`<div class="card"><b>${nome}: ${dias.length} dias</b><br><br>Dias: ${dias.map(x=>`<span style="background:#EFE8FF;border:1px solid #7C5CFC;padding:3px 8px;border-radius:12px;margin:2px;display:inline-block;font-weight:800;color:#4A2AC0">${x}</span>`).join('')}<br><br>${dias.map(x=>`Dia ${x} - ${nome}`).join('<br>')}</div>`;
}
function addArt(){
 let n=document.getElementById('nomeArt').value.trim().toUpperCase();
 if(!n) return;
 artistas.push(n);
 document.getElementById('nomeArt').value='';
 listaArt(); montaSel(); monta();
 alert(n+' salvo!');
}
function listaArt(){
 document.getElementById('listaArt').innerHTML=artistas.map((a,i)=>`<div style="display:flex;justify-content:space-between;padding:8px;background:#f5f5f5;border-radius:8px;margin-bottom:4px"><b>${a}</b><button onclick="artistas.splice(${i},1);listaArt();montaSel();monta()" style="background:#FFD2D2;border:none;padding:4px 8px;border-radius:6px">X</button></div>`).join('');
}

monta();montaSel();listaArt();
</script>
</body>
</html>
