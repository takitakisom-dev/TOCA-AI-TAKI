<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEDE AI V33 PREMIUM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system}
body{background:#0a0e1a;color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:10;background:#0f172a;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid #1e293b}
.badge{background:#22c55e;color:#000;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;margin-left:8px}
.bar{background:#22c55e;color:#000;text-align:center;padding:8px;font-weight:800;font-size:13px}
.search-wrap{padding:14px 16px;position:sticky;top:53px;background:#0a0e1a;z-index:9}
.search{width:100%;padding:14px 18px;border-radius:999px;background:#101c31;border:1px solid #1e293b;color:#fff;font-size:15px;outline:none}
#grid{padding:0 12px 100px}
.card{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:10px}
.card img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.info{flex:1;min-width:0}
.title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{color:#94a3b8;font-size:12px;margin-top:2px}
.play{background:#22c55e;color:#000;border:0;width:42px;height:42px;border-radius:50%;font-size:16px;font-weight:800}
.dono-tag{background:#f59e0b;color:#000;padding:2px 6px;border-radius:6px;font-size:10px;font-weight:800;margin-left:6px}
</style>
</head>
<body>
<header>
<div style="font-weight:800">🎵 PEDE AÍ <span class="badge">V33 PREMIUM</span><span id="dt"></span></div>
<button onclick="menu()" style="background:#1e293b;color:#fff;border:0;width:40px;height:40px;border-radius:10px;font-size:18px">☰</button>
</header>
<div class="bar">✅ V33 PREMIUM ATIVO - TUDO VOLTOU!</div>
<div class="search-wrap"><input id="busca" class="search" placeholder="🔍 Buscar música... ex: Ana Castela" oninput="filtrar()"></div>
<div id="grid"></div>
<script>
const isDono = new URLSearchParams(location.search).get('dono')==='TAKI123';
if(isDono) document.getElementById('dt').innerHTML='<span class="dono-tag">DONO</span>';
const MUSICAS=[
{t:"Boiadeira",a:"Ana Castela"},
{t:"Nosso Quadro",a:"Ana Castela"},
{t:"Bloqueado",a:"Gusttavo Lima"},
{t:"Termina Comigo Antes",a:"Gusttavo Lima"},
{t:"Traumatizei",a:"Henrique e Juliano"},
{t:"Notificação Preferida",a:"Zé Neto e Cristiano"},
{t:"Envolver",a:"Anitta"},
{t:"Leão",a:"Marília Mendonça"},
{t:"Sosseguei",a:"Jorge e Mateus"},
{t:"Aí Eu Bebo",a:"Maiara e Maraisa"},
{t:"Erro Gostoso",a:"Simone Mendes"},
{t:"Dengo",a:"João Gomes"}
];
function render(lista){
document.getElementById('grid').innerHTML=lista.map((m,i)=>`
<div class="card">
<img src="https://picsum.photos/seed/${i}${m.a}/100/100">
<div class="info"><div class="title">${m.t}</div><div class="artist">${m.a}</div></div>
<button class="play" onclick="tocar('${m.t} - ${m.a}')">▶</button>
</div>`).join('');
}
function filtrar(){
let q=document.getElementById('busca').value.toLowerCase();
render(MUSICAS.filter(m=> (m.t+' '+m.a).toLowerCase().includes(q)));
}
function tocar(n){alert('🎵 Pedido: '+n+'\n'+(isDono?'[MODO DONO]':'[MODO CLIENTE]'))}
function menu(){
if(isDono) alert('PAINEL DONO:\n✅ Site: Online\n✅ V33 Ativo\n✅ Músicas: '+MUSICAS.length+'\n\nLink cliente: /TOCA-AI-TAKI/');
else alert('PEDE AÍ - Jukebox Digital\nPeça sua música!');
}
render(MUSICAS);
</script>
</body>
</html>
