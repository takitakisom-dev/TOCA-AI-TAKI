<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAGEFLOW PRO - FIX CELULAR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{display:flex;min-height:100vh;background:#0f0f1e}
.sidebar{width:280px;background:#10101E;color:#fff;padding:20px 14px;position:fixed;height:100vh;left:0;top:0;z-index:1000;transition:.3s}
.sidebar h2{font-size:16px;margin-bottom:14px}
.backup{display:flex;gap:8px;margin-bottom:18px}
.backup button{flex:1;padding:10px 6px;border:none;border-radius:10px;font-size:12px;font-weight:900;cursor:pointer}
.btn-exp{background:#1DD1A1} .btn-imp{background:#FFC93C}
.menu button{width:100%;padding:14px 12px;border:none;border-radius:12px;text-align:left;font-weight:800;font-size:13px;color:#8B90A0;background:transparent;margin-bottom:8px;cursor:pointer}
.menu button.active{background:#7B5CFF;color:#fff}
.main{flex:1;margin-left:280px;background:#f5f5f7;min-height:100vh}
.top{padding:12px 14px;background:#0F3A4F;color:#fff;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
.hamb{display:none;background:rgba(255,255,255,.2);border:none;color:#fff;width:38px;height:38px;border-radius:10px;font-size:22px}
.btn-print{padding:10px 16px;border:none;border-radius:10px;background:#fff;color:#0F3A4F;font-weight:900}
.header-cal{background:#4D4D4D;color:#fff;padding:18px 16px;font-size:34px;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:6px;background:#fff}
.week div{background:#DCDCDC;text-align:center;padding:16px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:8px;background:#fff}
.cell{border:1.5px solid #777;background:#fff;min-height:210px;padding:10px;border-radius:8px}
.num{font-size:32px;font-weight:900;color:#333;display:flex;justify-content:space-between}
.line{display:flex;gap:6px;margin-top:5px;font-size:13.5px;align-items:flex-start}
.line b{min-width:28px;font-weight:900}
.line select{border:none;background:transparent;font-size:13.5px;font-weight:700;width:100%;appearance:none;cursor:pointer;white-space:normal;word-break:break-word}

/* FIX CELULAR - AQUI ESTAVA O PROBLEMA */
@media(max-width:900px){
.sidebar{left:-300px} .sidebar.show{left:0}
.main{margin-left:0}
.hamb{display:block}
.header-cal{font-size:26px}
.week{display:none} /* esconde Domingo Segunda no celular */
.cal{grid-template-columns:1fr !important;gap:12px;padding:12px}
.cell{min-height:auto !important;padding:16px !important;border-radius:14px}
.num{font-size:26px;margin-bottom:8px}
.line{font-size:16px !important;margin-top:8px}
.line select{font-size:16px !important}
.line b{font-size:16px}
}
@media print{.sidebar,.top{display:none!important} .main{margin-left:0!important}}
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
<h2>🔷 STAGEFLOW PRO</h2>
<div class="backup">
<button class="btn-exp" onclick="exportar()">📤 Exportar</button>
<button class="btn-imp" onclick="document.getElementById('imp').click()">📥 Importar</button>
<input type="file" id="imp" style="display:none" accept=".json" onchange="importar(this)">
</div>
<div class="menu">
<button>🏠 Dashboard</button>
<button class="active">📅 Agendamento Mensal</button>
<button>🎸 Artistas</button>
<button>🏠 Casas</button>
<button>💰 Financeiro</button>
<button>📊 Relatórios</button>
</div>
</div>
<div class="main">
<div class="top">
<div style="display:flex;align-items:center;gap:10px"><button class="hamb" onclick="document.getElementById('sidebar').classList.toggle('show')">☰</button><b>NOVEMBRO 2026</b></div>
<button class="btn-print" onclick="window.print()">🖨️ Imprimir Calendário</button>
</div>
<div class="header-cal">NOVEMBRO 2026</div>
<div class="week"><div>Domingo</div><div>Segunda</div><div>Terça</div><div>Quarta</div><div>Quinta</div><div>Sexta</div><div>Sábado</div></div>
<div class="cal" id="cal"></div>
</div>
<script>
const lista=["Cais - Eli","Vila Chopp - Grill","Grill - Luciano","Bar do Zé - Y Gon","Omau - Vago","Vago - Israel","Gar do Zé - Y Gon","Vago"];
let base={}; for(let i=1;i<=30;i++) base[i]=["Cais - Eli","Vila Chopp - Grill","Grill - Luciano","Bar do Zé - Y Gon","Omau - Vago","Vago - Israel"];
let store=JSON.parse(localStorage.getItem('fix-celular-final')||'null')||base;
function opts(s){return lista.map(v=>`<option ${v===s?'selected':''}>${v}</option>`).join('');}
function render(){
const cal=document.getElementById('cal'); cal.innerHTML='';
for(let d=1;d<=30;d++){
let arr=store[d]; let div=document.createElement('div'); div.className='cell';
div.innerHTML=`<div class="num">${d} <span>▼</span></div>
<div class="line"><b>P1:</b><select data-d="${d}" data-i="0">${opts(arr[0])}</select></div>
<div class="line"><b>P2:</b><select data-d="${d}" data-i="1">${opts(arr[1])}</select></div>
<div class="line"><b>P3:</b><select data-d="${d}" data-i="2">${opts(arr[2])}</select></div>
<div class="line"><b>P4:</b><select data-d="${d}" data-i="3">${opts(arr[3])}</select></div>
<div class="line"><b>P5:</b><select data-d="${d}" data-i="4">${opts(arr[4])}</select></div>
<div class="line"><b>P6:</b><select data-d="${d}" data-i="5">${opts(arr[5])}</select></div>`;
cal.appendChild(div);
}
document.querySelectorAll('select').forEach(s=>s.addEventListener('change',e=>{
store[e.target.dataset.d][e.target.dataset.i]=e.target.value;
localStorage.setItem('fix-celular-final',JSON.stringify(store));
}));
}
render();
function exportar(){let a=document.createElement('a');a.href="data:text/json;charset=utf-8,[STRIPPED]
function importar(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{localStorage.setItem('fix-celular-final',e.target.result);location.reload();};r.readAsText(f);}
</script>
</body>
</html>
