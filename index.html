<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEDE AI - dim dim</title>
<link id="manifestLink" rel="manifest" href="">
<meta name="theme-color" content="#22c55e">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh}
.hero{padding:24px;text-align:center}
.hero h1{font-size:42px;font-weight:900;letter-spacing:-1px}
.hero h1 span{color:#22c55e}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:999px;border:0;font-weight:800;cursor:pointer;font-size:14px;transition:.2s}
.btn-green{background:#22c55e;color:#000}
.btn-dark{background:#1a1a23;color:#fff;border:1px solid #2a2a35}
.btn:active{transform:scale(.97)}
.card{background:#15151f;border:1px solid #23232f;border-radius:20px;padding:18px;margin:12px 0}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #2a2a35;background:#0f0f18;color:#fff;font-size:15px;margin-top:8px}
#pageCliente,#pageDono{display:none}
.install-box{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;border-radius:20px;padding:20px;text-align:center;margin:16px 0}
.song{padding:14px;border-bottom:1px solid #23232f;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.song:hover{background:#1c1c28}
.badge{background:#22c55e;color:#000;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
.valor-btns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
</style>
</head>
<body>
<div id="pageLanding">
<div class="hero">
<h1>PEDE <span>AI</span></h1>
<p style="opacity:.7;margin:10px 0">Transforme pedidos em <b>dim,dim💰</b> ao vivo</p>
<div class="card" style="max-width:440px;margin:20px auto;text-align:left">
<h3 style="text-align:center">🎤 Criar seu link de cantor</h3>
<input id="nomeCantor" placeholder="🎤 Seu nome artístico">
<input id="pixCantor" placeholder="🔑 Sua chave PIX">
<input id="nomePix" placeholder="👤 Nome que aparece no PIX">
<label style="font-size:13px;opacity:.7;margin-top:10px;display:block">💰 Valor sugerido:</label>
<select id="valorCantor">
<option value="2">R$ 2 - Barzinho</option>
<option value="5" selected>R$ 5 - Padrão</option>
<option value="10">R$ 10 - Top</option>
<option value="20">R$ 20 - Premium</option>
<option value="50">R$ 50 - Super fã</option>
<option value="livre">💲 Livre - cliente escolhe</option>
</select>
<button class="btn btn-green" style="width:100%;margin-top:14px;padding:16px;font-size:16px" onclick="criarLink()">CRIAR MEU LINK GRÁTIS</button>
<p id="linkGerado" style="margin-top:14px;word-break:break-all;font-size:13px;text-align:center"></p>
</div>
</div>
</div>
