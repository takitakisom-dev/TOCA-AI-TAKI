<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAGEFLOW PRO DEFINITIVO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#fff}
.top{background:#10101e;color:#fff;padding:10px;display:flex;gap:6px}
.top b{flex:1;font-size:12px}
.top button{padding:8px 12px;border:none;border-radius:8px;font-weight:800}
.btnMenu{background:#FFD600;color:#000;padding:12px;border:none;border-radius:10px;font-weight:900;margin:8px;width:calc(100% - 16px)}
.barra{background:#000;color:#fff;padding:6px;text-align:center;font-weight:900;font-size:11px}
.grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px}
.dsem{background:#ddd;padding:6px 0;text-align:center;font-weight:800;font-size:10px;border-radius:4px}
.dia{background:#fff;border:1px solid #333;border-radius:6px;padding:4px;min-height:170px}
.num{font-weight:900;color:#0B3D91;font-size:11px}
.l{font-size:7px;display:flex;gap:2px;margin-top:2px}
.l select{flex:1;font-size:7px;border:1px solid #aaa;border-radius:3px}
.l select.t{width:34px;background:#EFE8FF}
.card{background:#fff;border-radius:10px;padding:12px;margin:8px;border:1px solid #ddd}
.sec{display:none}.sec.show{display:block}
</style>
</head>
<body>
<div class="top"><b>STAGEFLOW PRO • NOV 2026 • DEFINITIVO</b><button onclick="window.print()">🖨️</button></div>
<button class="btnMenu" onclick="alert('Menu: Grade 1-30 já está na tela. Artistas com cachê no botão abaixo')">☰ MENU - GRADE 1-30 ABAIXO</button>
<div class="barra">NOV 2026 • 1 DOM AO 30 SEG • P1-P6 • AL=Almoço JA=Janta AL/JA=Junto • COM CACHÊ</div>
<div class="grade"><div class="dsem">Dom</div><div class="dsem">Seg</div><div class="dsem">Ter</div><div class="dsem">Qua</div><div class="dsem">Qui</div><div class="dsem">Sex</div><div class="dsem">Sab</div></div>
<div class="grade" id="cal"></div>

<div class="card">
<h3>🎤 ARTISTAS - NOME + CACHÊ</h3>
<div style="display:flex;gap:6px;margin-top:8px">
<input id="nomeArt" placeholder="NOME ex: ANDRE" style="flex:1;padding:10px;border:1px solid #ccc;border-radius:8px;font-weight:800">
<input id="cacheArt" type="number" placeholder="R$ 350" style="width:100px;padding:10px;border:1px solid #ccc;border-radius:8px;font-weight:800">
</div>
<button onclick="addArt()" style="width:100%;margin-top:8px;padding:12px;background:#7C5CFC;color:#fff;border:none;border-radius:8px;font-weight:900">SALVAR NOME + CACHÊ</button>
<div id="listaArt"></div>
<div id="relatorio" style="margin-top:12px"></div>
</div>

<script>
// SEMPRE COMEÇA LIMPO - NÃO LÊ CACHE VELHO
var artistas = [
{nome:"ANDRE",cache:300},{nome:"EDILL",cache:350},{nome:"LUCIANO",cache:300},{nome:"PAOLI",cache:320},{nome:"ISRAEL",cache:300},{nome:"YGOR",cache:280}
];
var casas = {p1:"Cais",p2:"Vila",p3:"Grill",p4:"Ze",p5:"Omau",p6:"Vago"};
var dados = {};
for(var d=1; d<=30; d++){ dados[d]=[]; for(var p=0;p<6;p++) dados[d].push({a:"ANDRE",t:"AL"}); }

function monta(){
 var cal = document.getElementById('cal');
 cal.innerHTML = '';
 var diasSem = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
 for(var dia=1; dia<=30; dia++){
  var ds = diasSem[(dia-1)%7];
  var html = '<div class="num">'+dia+' '+ds+'</div>';
  for(var p=0; p<6; p++){
   var cur = dados[dia][p];
   var optArt = '';
   for(var i=0;i<artistas.length;i++){ optArt += '<option value="'+artistas[i].nome+'" '+(artistas[i].nome==cur.a?'selected':'')+'>'+artistas[i].nome+' R$'+artistas[i].cache+'</option>'; }
   var optT = '<option '+(cur.t=='AL'?'selected':'')+'>AL</option><option '+(cur.t=='JA'?'selected':'')+'>JA</option><option '+(cur.t=='AL/JA'?'selected':'')+'>AL/JA</option>';
   html += '<div class="l">P'+(p+1)+':<select onchange="dados['+dia+']['+p+'].a=this.value; atualizaRel()">'+optArt+'</select><select class="t" onchange="dados['+dia+']['+p+'].t=this.value">'+optT+'</select></div>';
  }
  var div = document.createElement('div'); div.className='dia'; div.innerHTML=html; cal.appendChild(div);
 }
 atualizaRel();
}
function addArt(){
 var n = document.getElementById('nomeArt').value.toUpperCase().trim();
 var c = parseFloat(document.getElementById('cacheArt').value)||0;
 if(!n) return;
 var idx = -1;
 for(var i=0;i<artistas.length;i++) if(artistas[i].nome==n) idx=i;
 if(idx>=0) artistas[idx].cache=c; else artistas.push({nome:n,cache:c});
 document.getElementById('nomeArt').value=''; document.getElementById('cacheArt').value='';
 listaArt(); monta();
}
function listaArt(){
 var h='';
 for(var i=0;i<artistas.length;i++){ h+='<div style="display:flex;justify-content:space-between;padding:8px;background:#f2f2f2;border-radius:8px;margin-top:6px"><b>'+artistas[i].nome+' <span style="color:green">R$'+artistas[i].cache+'</span></b><button onclick="artistas.splice('+i+',1);listaArt();monta()" style="background:#FFD2D2;border:none;padding:4px 8px;border-radius:4px">X</button></div>'; }
 document.getElementById('listaArt').innerHTML=h;
}
function atualizaRel(){
 var html='<h4>📊 Relatório + Cachê Total</h4>';
 for(var i=0;i<artistas.length;i++){
  var art=artistas[i]; var qtd=0;
  for(var d=1;d<=30;d++) for(var p=0;p<6;p++) if(dados[d][p].a==art.nome) qtd++;
  if(qtd>0) html+='<div style="padding:6px;border-left:4px solid #7C5CFC;margin-top:6px;background:#fff"> <b>'+art.nome+'</b>: '+qtd+' shows x R$'+art.cache+' = <b style="color:green">R$ '+(qtd*art.cache)+'</b></div>';
 }
 document.getElementById('relatorio').innerHTML=html;
}

// FORÇA MONTAR DE QUALQUER JEITO
window.onload = function(){ setTimeout(monta,100); };
monta();
listaArt();
</script>
</body>
</html>
