<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAGEFLOW PRO - FUNCIONA</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#f2f2f5}
.top{background:#10101e;color:#fff;padding:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:1000}
.top b{flex:1;font-size:11px}
.top button{padding:8px 10px;border:none;border-radius:8px;font-weight:800;font-size:10px}
.green{background:#7CFF9A;color:#000}
.white{background:#fff;color:#000}
.menu{padding:8px;background:#fff;display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid #ddd;position:sticky;top:44px;z-index:999}
.menu button{padding:10px 12px;border:none;border-radius:8px;font-weight:800;background:#eee;font-size:11px}
.menu button.on{background:#10101e;color:#fff}
.barra{background:#222;color:#fff;padding:6px;text-align:center;font-weight:900;font-size:10px}
.grade{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:4px;background:#f2f2f5}
.dsem{background:#ddd;padding:5px 0;text-align:center;font-weight:800;font-size:10px;border-radius:4px}
.dia{background:#fff;border:1.2px solid #333;border-radius:6px;padding:4px;min-height:150px}
.dia .num{font-size:12px;font-weight:900;color:#0B3D91}
.l{font-size:7px;font-weight:700;display:flex;gap:2px;margin-top:2px;align-items:center}
.l i{width:16px;font-style:normal}
.l select{flex:1;padding:2px;border-radius:3px;border:1px solid #aaa;font-size:7px;font-weight:700}
.l select.t{width:28px;background:#EFE8FF;color:#4A2AC0;font-weight:900}
.sec{display:none}.sec.show{display:block}
.card{background:#fff;border-radius:8px;padding:10px;margin:8px}
@media print{@page{size:A4 landscape;margin:3mm} .top,.menu{display:none!important} .barra{font-size:6px!important;padding:2px!important;background:#000!important;color:#fff!important} .grade{gap:2px!important;padding:2px!important} .dsem{font-size:5px!important;padding:1px 0!important} .dia{height:36mm!important;min-height:0!important;padding:1px!important;border:0.6px solid #000!important;overflow:hidden} .dia .num{font-size:6px!important} .l{font-size:4.5px!important;margin-top:0!important} .l select{font-size:4.5px!important;height:8px!important;padding:0!important}}
</style>
</head>
<body>

<div class="top">
<b>STAGEFLOW PRO • NOV 2026 • COMPLETO</b>
<button class="green" onclick="go('rel')">📊 Relatório</button>
<button class="white" onclick="window.print()">🖨️ Imprimir 1 Folha</button>
<button class="white" onclick="exportar()">💾 Backup</button>
</div>

<div class="menu">
<button id="b-cal" class="on" onclick="go('cal')">📅 Grade Mensal</button>
<button id="b-rel" onclick="go('rel')">📊 Relatório Artista</button>
<button id="b-art" onclick="go('art')">🎤 Artistas</button>
<button id="b-casa" onclick="go('casa')">🏠 Casas P1-P6</button>
<button id="b-agenda" onclick="go('agenda')">📋 Agenda Completa</button>
<button id="b-back" onclick="go('back')">💾 Backup</button>
</div>

<div id="sec-cal" class="sec show">
<div class="barra">NOVEMBRO 2026 • 1 AO 30 • P1-P6 = CASAS • AL=Almoço JA=Janta • 1 FOLHA</div>
<div class="grade"><div class="dsem">Dom</div><div class="dsem">Seg</div><div class="dsem">Ter</div><div class="dsem">Qua</div><div class="dsem">Qui</div><div class="dsem">Sex</div><div class="dsem">Sab</div></div>
<div class="grade" id="cal"></div>
</div>

<div id="sec-rel" class="sec"><div class="barra">RELATÓRIO</div><div class="card"><select id="selArt" style="width:100%;padding:10px;font-weight:800"></select><button onclick="relTodos()" style="width:100%;margin-top:8px;padding:10px;background:#0A7A2A;color:#fff;border:none;border-radius:8px;font-weight:800">VER DIAS 1,2,3...</button></div><div id="resRel"></div></div>
<div id="sec-art" class="sec"><div class="barra">ARTISTAS</div><div class="card"><input id="nomeArt" placeholder="Nome ANDRE" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button onclick="addArt()" style="width:100%;margin-top:8px;padding:10px;background:#7C5CFC;color:#fff;border:none;border-radius:8px;font-weight:900">SALVAR</button><div id="listaArt"></div></div></div>
<div id="sec-casa" class="sec"><div class="barra">CASAS P1-P6</div><div class="card"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="p1" placeholder="P1"><input id="p2" placeholder="P2"><input id="p3" placeholder="P3"><input id="p4" placeholder="P4"><input id="p5" placeholder="P5"><input id="p6" placeholder="P6"></div><button onclick="saveCasas()" style="width:100%;margin-top:8px;padding:10px;background:#10101e;color:#fff;border:none;border-radius:8px;font-weight:800">Salvar Casas</button></div></div>
<div id="sec-agenda" class="sec"><div class="barra">AGENDA COMPLETA 1 AO 30</div><div id="resAgenda"></div></div>
<div id="sec-back" class="sec"><div class="barra">BACKUP</div><div class="card"><button onclick="exportar()" style="width:100%;padding:12px;background:#10101e;color:#fff;border:none;border-radius:8px;font-weight:900">BAIXAR BACKUP</button><input type="file" id="fileIn" accept=".json" style="display:none" onchange="importar(event)"><button onclick="document.getElementById('fileIn').click()" style="width:100%;margin-top:8px;padding:12px;background:#eee;border:none;border-radius:8px;font-weight:800">RESTAURAR BACKUP</button></div></div>

<script>
let artistas=["ANDRE","Eli","Grill","Luciano","Y Gon","Israel","Vago","EDILL","PAOLI"];
let casas={p1:"Cais",p2:"Vila Chopp",p3:"Grill",p4:"Bar do Ze",p5:"Omau",p6:"Vago"};
let dados={};
for(let d=1; d<=30; d++){ dados[d]=[]; for(let p=0;p<6;p++) dados[d].push({a:"ANDRE",t:"AL"}); }

function go(id){
 document.querySelectorAll('.sec').forEach(s=>s.classList.remove('show'));
 document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));
 document.getElementById('sec-'+id).classList.add('show');
 let btn=document.getElementById('b-'+id); if(btn) btn.classList.add('on');
 if(id=='cal') monta();
 if(id=='rel'){ montaSel(); relTodos(); }
 if(id=='art') listaArt();
 if(id=='casa') fillCasas();
 if(id=='agenda') agenda();
}

function monta(){
 try{
  let cal=document.getElementById('cal'); cal.innerHTML='';
  for(let d=1; d<=30; d++){
   let div=document.createElement('div'); div.className='dia';
   let h='<div class="num">'+d+' ▼</div>';
   for(let p=0;p<6;p++){
    let cur=dados[d][p]||{a:"ANDRE",t:"AL"};
    let opArt=artistas.map(a=>'<option '+(a==cur.a?'selected':'')+'>'+a+'</option>').join('');
    let opT='<option '+(cur.t=='AL'?'selected':'')+'>AL</option><option '+(cur.t=='JA'?'selected':'')+'>JA</option><option '+(cur.t=='AL/JA'?'selected':'')+'>AL/JA</option>';
    h+='<div class="l"><i>P'+(p+1)+':</i><select data-d="'+d+'" data-p="'+p+'" class="sa">'+opArt+'</select><select data-d="'+d+'" data-p="'+p+'" class="st t">'+opT+'</select></div>';
   }
   div.innerHTML=h; cal.appendChild(div);
  }
  let resto=7-(30%7); if(resto<7) for(let i=0;i<resto;i++){let e=document.createElement('div'); e.className='dia'; e.style.background='#efefef'; cal.appendChild(e);}
  cal.querySelectorAll('select').forEach(s=>s.addEventListener('change',e=>{
   let d=e.target.dataset.d,p=e.target.dataset.p;
   if(e.target.classList.contains('sa')) dados[d][p].a=e.target.value; else dados[d][p].t=e.target.value;
   try{localStorage.setItem('STAGEFLOW_PERMANENTE_2026',JSON.stringify({artistas:artistas,casas:casas,dados:dados}))}catch(err){}
  }));
 }catch(err){ document.getElementById('cal').innerHTML='<div class="card">Erro: '+err.message+'</div>'; }
}

function montaSel(){ document.getElementById('selArt').innerHTML=artistas.map(a=>'<option>'+a+'</option>').join(''); }
function relTodos(){
 let html='';
 for(let nome of artistas){
  let dias=[]; for(let d=1; d<=30; d++) for(let p=0;p<6;p++) if(dados[d][p].a==nome) if(!dias.includes(d)) dias.push(d);
  if(dias.length==0) continue;
  dias.sort((a,b)=>a-b);
  html+='<div class="card" style="border-left:4px solid #7C5CFC"><b>'+nome+': '+dias.length+' shows</b><br>Dias: '+dias.join(', ')+'</div>';
 }
 document.getElementById('resRel').innerHTML=html||'<div class="card">Nenhum</div>';
}
function agenda(){
 let html='';
 for(let d=1; d<=30; d++){
  let l=[]; for(let p=0;p<6;p++) l.push('P'+(p+1)+' ('+casas['p'+(p+1)]+'): '+dados[d][p].a+' - '+dados[d][p].t);
  html+='<div class="card" style="border-left:4px solid #0B3D91"><b>Dia '+d+'</b><div style="font-size:11px;margin-top:4px">'+l.join('<br>')+'</div></div>';
 }
 document.getElementById('resAgenda').innerHTML=html;
}
function addArt(){ let n=document.getElementById('nomeArt').value.trim().toUpperCase(); if(!n) return; artistas.push(n); document.getElementById('nomeArt').value=''; saveAll(); listaArt(); montaSel(); monta(); }
function listaArt(){ document.getElementById('listaArt').innerHTML=artistas.map((a,i)=>'<div style="display:flex;justify-content:space-between;padding:6px;background:#f5f5f5;border-radius:6px;margin-top:4px"><b>'+a+'</b><button onclick="artistas.splice('+i+',1);saveAll();listaArt();montaSel();monta()" style="background:#FFD2D2;border:none;padding:2px 6px;border-radius:4px">X</button></div>').join(''); }
function fillCasas(){ document.getElementById('p1').value=casas.p1; document.getElementById('p2').value=casas.p2; document.getElementById('p3').value=casas.p3; document.getElementById('p4').value=casas.p4; document.getElementById('p5').value=casas.p5; document.getElementById('p6').value=casas.p6; }
function saveCasas(){ casas={p1:document.getElementById('p1').value||'P1',p2:document.getElementById('p2').value||'P2',p3:document.getElementById('p3').value||'P3',p4:document.getElementById('p4').value||'P4',p5:document.getElementById('p5').value||'P5',p6:document.getElementById('p6').value||'P6'}; saveAll(); alert('Salvo!'); }
function saveAll(){ try{ localStorage.setItem('STAGEFLOW_PERMANENTE_2026',JSON.stringify({artistas:artistas,casas:casas,dados:dados})); }catch(e){} }
function exportar(){ let a=document.createElement('a'); a.href="data:text/json;charset=utf-8,[STRIPPED] a.download="BACKUP.json"; a.click(); }
function importar(e){ let f=e.target.files[0]; if(!f) return; let r=new FileReader(); r.onload=function(ev){ try{ let o=JSON.parse(ev.target.result); if(o.artistas) artistas=o.artistas.map(x=>typeof x==='string'?x:x.nome); if(o.casas) casas=o.casas; if(o.dados) dados=o.dados; saveAll(); location.reload(); }catch(err){} }; r.readAsText(f); }

// MONTA NA HORA - SEM DEPENDER DE NADA
monta(); montaSel(); listaArt(); fillCasas();

// DEPOIS tenta recuperar sem quebrar
setTimeout(()=>{
 try{
  let txt=localStorage.getItem('STAGEFLOW_PERMANENTE_2026');
  if(!txt) return;
  let o=JSON.parse(txt);
  if(o.artistas && o.artistas.length>artistas.length){
    artistas=o.artistas.map(x=>typeof x==='string'?x:x.nome);
    if(o.casas) casas=o.casas;
    if(o.dados) dados=o.dados;
    monta(); montaSel(); listaArt(); fillCasas();
  }
 }catch(e){}
}, 600);
</script>
</body>
</html>
