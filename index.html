<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAGEFLOW PRO - CASAS ENLARGUECIDAS</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{display:flex;min-height:100vh;background:#0f0f1e}
.sidebar{width:280px;background:#10101E;color:#fff;padding:20px 14px;position:fixed;height:100vh;left:0;top:0;z-index:1000;overflow:auto}
.sidebar h2{font-size:16px;margin-bottom:14px}
.backup{display:flex;gap:6px;margin-bottom:18px}
.backup button{flex:1;padding:9px 6px;border:none;border-radius:8px;font-size:11px;font-weight:800;cursor:pointer}
.btn-exp{background:#1DD1A1;color:#000} .btn-imp{background:#FFC93C;color:#000}
.menu button{width:100%;padding:13px 12px;border:none;border-radius:11px;text-align:left;font-weight:800;font-size:13px;color:#8B90A0;background:transparent;margin-bottom:7px;cursor:pointer}
.menu button.active{background:#7B5CFF;color:#fff}
.main{flex:1;margin-left:280px;background:#f5f5f7;min-height:100vh}
.top{padding:12px 16px;background:#0F3A4F;color:#fff;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.top b{font-size:14px}
.btn-print{padding:8px 14px;border:none;border-radius:8px;background:#fff;color:#0F3A4F;font-weight:800;cursor:pointer}
.header-cal{background:#4D4D4D;color:#fff;padding:16px 18px;font-size:30px;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:6px;background:#fff}
.week div{background:#DCDCDC;text-align:center;padding:15px 0;font-size:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:0 8px 20px;background:#fff}
.cell{border:1.5px solid #6A6A6A;background:#fff;min-height:240px;padding:10px 10px;border-radius:6px}
.cell.gray{background:#E6E6E6}
.num{font-size:28px;font-weight:900;color:#333;display:flex;justify-content:space-between;margin-bottom:6px}
.line{display:flex;gap:5px;margin-top:4px;font-size:13px;line-height:1.35;align-items:flex-start}
.line b{min-width:26px;font-weight:900;color:#000}
.line span{flex:1;word-break:break-word;white-space:normal}
.line select{border:none;background:transparent;font-size:13px;font-weight:700;width:100%;cursor:pointer;appearance:none;white-space:normal;word-break:break-word}
@media print{.sidebar,.top{display:none!important} .main{margin-left:0!important} .cal{grid-template-columns:repeat(3,1fr)!important} .cell{min-height:auto!important;break-inside:avoid}}
@media(max-width:1100px){.cal{grid-template-columns:repeat(4,1fr)} .week{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){.cal{grid-template-columns:repeat(2,1fr)} .week{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="sidebar">
<h2>🔷 STAGEFLOW PRO</h2>
<div class="backup">
<button class="btn-exp" onclick="exportar()">📤 Exportar</button>
<button class="btn-imp" onclick="document.getElementById('importFile').click()">📥 Importar</button>
<input type="file" id="importFile" style="display:none" accept=".json" onchange="importar(this)">
</div>
<div class="menu">
<button>🏠 Dashboard</button>
<button class="active">📅 Agendamento Mensal</button>
<button>🎸 Artistas</button>
<button>🏠 Casas</button>
<button>💰 Financeiro</button>
<button>📊 Relatórios</button>
</div>
</div>
<div class="main">
<div class="top"><b>STAGEFLOW PRO • NOVEMBRO 2026</b><button class="btn-print" onclick="window.print()">🖨️ Imprimir Calendário</button></div>
<div class="header-cal">NOVEMBRO 2026</div>
<div class="week"><div>Domingo</div><div>Segunda</div><div>Terça</div><div>Quarta</div><div>Quinta</div><div>Sexta</div><div>Sábado</div></div>
<div class="cal" id="cal"></div>
</div>
<script>
const lista=["Cais - Eli","Vila Chopp - Grill","Grill - Luciano","Bar do Zé - Y Gon","Omau - Vago","Vago - Israel","Gar do Zé - Y Gon","Vago"];
let base={}; for(let i=1;i<=30;i++) base[i]=["Cais - Eli","Vila Chopp - Grill","Grill - Luciano","Bar do Zé - Y Gon","Omau - Vago","Vago - Israel"];
let store=JSON.parse(localStorage.getItem('stage-enlarge-final')||'null')||base;
function opts(s){return lista.map(v=>`<option ${v===s?'selected':''}>${v}</option>`).join('');}
function render(){
const cal=document.getElementById('cal'); cal.innerHTML='';
for(let d=1;d<=30;d++){
let arr=store[d]; let div=document.createElement('div'); div.className='cell';
div.innerHTML=`<div class="num">${d}<span>▼</span></div>
<div class="line"><b>P1:</b><select data-d="${d}" data-i="0">${opts(arr[0])}</select></div>
<div class="line"><b>P2:</b><select data-d="${d}" data-i="1">${opts(arr[1])}</select></div>
<div class="line"><b>P3:</b><select data-d="${d}" data-i="2">${opts(arr[2])}</select></div>
<div class="line"><b>P4:</b><select data-d="${d}" data-i="3">${opts(arr[3])}</select></div>
<div class="line"><b>P5:</b><select data-d="${d}" data-i="4">${opts(arr[4])}</select></div>
<div class="line"><b>P6:</b><select data-d="${d}" data-i="5">${opts(arr[5])}</select></div>`;
cal.appendChild(div);
}
for(let i=0;i<5;i++){let g=document.createElement('div');g.className='cell gray';cal.appendChild(g);}
document.querySelectorAll('select').forEach(s=>s.addEventListener('change',e=>{
store[e.target.dataset.d][e.target.dataset.i]=e.target.value;
localStorage.setItem('stage-enlarge-final',JSON.stringify(store));
}));
}
render();
function exportar(){let a=document.createElement('a');a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(store));a.download="backup-stageflow.json";a.click();}
function importar(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{localStorage.setItem('stage-enlarge-final',e.target.result);location.reload();};r.readAsText(f);}
</script>
</body>
</html>
