<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel - ANDRÉ TAKI</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0;padding:8px}
.card{background:#1a1a1a;border-radius:12px;padding:10px;margin-bottom:10px}
.badge{padding:6px 10px;border-radius:20px;font-size:11px;font-weight:bold}
.btn{padding:10px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px}
input,textarea{width:95%;padding:10px;border-radius:8px;border:none;margin:4px 0}
.musica-lista{display:flex;justify-content:space-between;background:#242424;padding:8px;margin:4px 0;border-radius:8px}
</style>
</head>
<body>
<div class="card">
<b>🎤 Painel - ANDRÉ TAKI - CONTROLE TOTAL</b><br><br>
<input id="pix" value="3499462882" placeholder="Seu PIX (CPF, telefone, chave)">
<label>Caixinha ativa? <input type="checkbox" id="caixinhaAtiva" checked> Ativar caixinha LIVRE, 2,5,10,20,50</label>
<label>Recado ativo? <input type="checkbox" id="recadoAtivo" checked> Permitir cliente mandar recado</label>
<div>
<button class="btn" style="background:#00e676" onclick="testarSom()">🔊 TESTAR SOM</button>
<button class="btn" style="background:#00e676" id="bOn" onclick="setShow(true)">✅ SHOW LIBERADO</button>
<button class="btn" style="background:#ff9100;display:none" id="bOff" onclick="setShow(false)">⏸️ PAUSADO</button>
<span id="fbStatus" style="color:yellow;font-size:12px"></span>
</div>
</div>

<div class="card">
<b>🎵 Repertório Completo (<span id="qtd"></span>)</b>
<textarea id="repertorioInput" rows="12" placeholder="Uma música por linha, ex: METADE - ADRIANA CALCANHOTO"></textarea>
<input id="nova" placeholder="Nova música - ENTER pra adicionar">
<button class="btn" style="background:#00e676;color:#000;width:100%" onclick="salvarTudo()">💾 SALVAR TUDO NA NUVEM - LIBERAR TODAS MÚSICAS</button>
<div id="lista"></div>
<div style="text-align:center"><div id="qrcode" style="background:#fff;padding:10px;border-radius:10px;width:200px;margin:10px auto"></div>
<small id="linkTxt" style="color:#00ff88;font-size:10px;word-break:break-all"></small><br>
<button class="btn" style="background:#fff" onclick="copiar()">📋 COPIAR LINK CLIENTE</button>
</div>
</div>

<div class="card">
<b>🔴 AO VIVO - Pedidos + Recados + Pix</b>
<div id="aoVivo"></div>
</div>

<script>
const firebaseConfig={apiKey:"AIzaSyD8JftaM8BwYLKa_3TAjHqN1ub151Myvgo",authDomain:"pede-ai-pro.firebaseapp.com",databaseURL:"https://pede-ai-pro-default-rtdb.firebaseio.com",projectId:"pede-ai-pro",storageBucket:"pede-ai-pro.firebasestorage.app",messagingSenderId:"549558191964",appId:"1:549558191964:web:40614401989e404af6a399"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let nome="ANDRÉ TAKI"; let fone="553499462882";
let rep=JSON.parse(localStorage.getItem('taki_rep_full')||'["METADE - ADRIANA CALCANHOTO","EVIDÊNCIAS - CHITÃOZINHO E XORORÓ","ELEVADOR - ANA CAROLINA","QUEM DE NÓS DOIS - ANA CAROLINA","TREMA BALA - ANA VILELA","SANDRA ROSA MADALENA - SIDNEY MAGAL"]');
function render(){document.getElementById('lista').innerHTML=""; rep.forEach((m,i)=>{document.getElementById('lista').innerHTML+=`<div class=musica-lista><span>${m}</span><button style="background:#ff1744;color:#fff" onclick="remover(${i})">X</button></div>`}); document.getElementById('qtd').innerText=rep.length; document.getElementById('repertorioInput').value=rep.join('\n');}
function remover(i){rep.splice(i,1); render();}
document.getElementById('nova').addEventListener('keydown',e=>{if(e.key==='Enter'){rep.unshift(e.target.value); e.target.value=''; render();}});
document.getElementById('repertorioInput').addEventListener('input',e=>{rep=e.target.value.split('\n').filter(s=>s.trim());});
function testarSom(){new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();}
function setShow(v){db.ref('empresas/'+getId()).update({showLiberado:v}); document.getElementById('bOn').style.display=v?'none':''; document.getElementById('bOff').style.display=v?'':'none';}
function getId(){return btoa(nome+"|"+fone).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_');}
function salvarTudo(){
 let pix=document.getElementById('pix').value; let caixinha=document.getElementById('caixinhaAtiva').checked; let recado=document.getElementById('recadoAtivo').checked;
 document.getElementById('fbStatus').innerText="Salvando TODAS músicas...";
 db.ref('empresas/'+getId()).set({nome,fone,repertorio:rep,pix,config:{caixinha,recado},showLiberado:true,atualizado:new Date().toISOString()}).then(()=>{
  document.getElementById('fbStatus').innerText="✅ TODAS SALVAS!"; localStorage.setItem('taki_rep_full',JSON.stringify(rep));
  let link=`https://takitakisom-dev.github.io/TOCA-AI-TAKI/cliente.html?c=${getId()}`;
  document.getElementById('qrcode').innerHTML=""; new QRCode(document.getElementById("qrcode"),{text:link,width:180,height:180}); document.getElementById('linkTxt').innerText=link;
 });
}
function copiar(){navigator.clipboard.writeText(document.getElementById('linkTxt').innerText); alert('Link copiado!');}
function ouvir(){db.ref('empresas/'+getId()+'/pedidos').on('value',s=>{let d=s.val(); let div=document.getElementById('aoVivo'); if(!d){div.innerHTML="Nenhum pedido ainda"; return;} let h=""; Object.values(d).reverse().forEach(p=>{h+=`<div style="background:#242424;padding:8px;margin:4px;border-radius:8px;border-left:4px solid #00e676">🎵 ${p.musica}<br>💰 Caixinha: R$${p.valor||'LIVRE'}<br>💬 Recado: ${p.recado||'-'}<br><small>${p.hora}</small></div>`}); div.innerHTML=h;});}
window.onload=()=>{render(); salvarTudo(); ouvir();}
</script>
</body>
</html>
