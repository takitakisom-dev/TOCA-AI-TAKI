<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEDE AI V30</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22c55e">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f172a;color:#fff}
.top{background:linear-gradient(135deg,#22c55e,#7c3aed);padding:16px;text-align:center}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:14px;margin:10px}
.inp{width:100%;padding:14px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;margin:6px 0;font-size:16px}
.btn{padding:14px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.btn-blue{background:#2563eb;color:#fff;flex:1}
.btn-green{background:#16a34a;color:#fff;width:100%;padding:16px;border-radius:12px;margin-top:8px;font-size:17px}
.btn-red{background:#ef4444;color:#fff;width:100%;padding:16px;border-radius:12px;margin-top:8px;font-size:15px}
.music{padding:14px;border-radius:12px;border:1px solid #334155;background:#0f172a;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.cal{padding:14px;border-radius:12px;border:2px solid #334155;background:#0f172a;text-align:center;font-weight:900;cursor:pointer;flex:1}
.cal.on{border-color:#22c55e;background:#dcfce7;color:#14532d}
.alertTop{position:fixed;top:10px;left:10px;right:10px;background:#16a34a;color:#fff;padding:18px;border-radius:14px;font-weight:900;z-index:9999;display:none;text-align:center}
.qrWrap{background:#fff;border-radius:18px;padding:14px;text-align:center;color:#0f172a}
.pixModal{position:fixed;inset:0;background:rgba(0,0,0,.95);z-index:10000;display:none;align-items:center;justify-content:center;padding:16px}
.pixCard{background:#fff;color:#0f172a;border-radius:20px;padding:20px;max-width:380px;width:100%;text-align:center}
.pixCode{word-break:break-all;background:#f1f5f9;border:2px dashed #22c55e;border-radius:10px;padding:12px;font-size:11px;margin:10px 0;text-align:left}
.showON{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;padding:14px;border-radius:12px;text-align:center;font-weight:900;font-size:18px}
.showOFF{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:900;font-size:18px}
</style>
</head>
<body>
<div class="top"><h1>🎵 PEDE AÍ</h1><small id="topSub">V30 FIX</small></div>
<div id="alertTop" class="alertTop"></div>
<div id="vCli">
<div class="card" id="cardStatusCli" style="display:none;text-align:center;font-weight:900;padding:20px;border-radius:16px"></div>
<div class="card"><input id="busca" class="inp" placeholder="🔍 Buscar música..." oninput="renderCli()"><div id="listaCli"></div></div>
<div class="card" id="formPedido" style="display:none;border:3px solid #22c55e">
<h3 id="musicaSelTxt" style="color:#22c55e"></h3><small id="cantorSelTxt"></small>
<input id="nomeCli" class="inp" placeholder="Seu nome"><input id="recadoCli" class="inp" placeholder="Recado / Oferecer pra alguém">
<p style="font-weight:800;margin:12px 0 8px">💰 Caixinha? (opcional)</p>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
<div class="cal" id="c2" onclick="setCaixa(2)">R$2</div><div class="cal" id="c5" onclick="setCaixa(5)">R$5</div><div class="cal" id="c10" onclick="setCaixa(10)">R$10</div>
</div>
<div style="display:flex;gap:6px;margin-top:8px"><input id="outroValor" type="number" class="inp" style="flex:1;margin:0" placeholder="Outro: 20,50,100" oninput="setCaixaCustom(this.value)"><button class="btn-blue" style="flex:0 0 70px" onclick="aplicarOutro()">OK</button></div>
<p id="pixPreview" style="color:#22c55e;text-align:center;margin-top:8px;font-weight:800;display:none"></p>
<button class="btn-green" id="btnEnviar" onclick="enviar()">ENVIAR PEDIDO</button>
</div>
</div>
<div id="vDono" style="display:none">
<div class="card" style="border:3px solid #22c55e;background:#052e16;text-align:center">
<h2>🎤 CONTROLE DO SHOW</h2>
<div id="showStatusBox" style="margin:10px 0"></div>
<button id="btnToggleShow" class="btn-green" style="font-size:20px;padding:20px" onclick="toggleShow()">INICIAR SHOW</button>
<div style="display:flex;gap:8px;margin-top:10px">
<button onclick="forcarSync()" style="flex:1;background:#0f172a;color:#94a3b8;border:1px dashed #334155;padding:10px;border-radius:8px;font-size:11px">🔄 FORÇAR SINCRONIA</button>
<button onclick="testarPix()" style="flex:1;background:#f59e0b;color:#000;border:none;padding:10px;border-radius:8px;font-size:11px;font-weight:900">💰 TESTAR PIX</button>
</div>
</div>
<div class="card" style="background:linear-gradient(135deg,#f59e0b,#f97316);color:#000;text-align:center"><h2>💰 CAIXINHA HOJE</h2><div id="totalCaixa" style="font-size:34px;font-weight:900">R$ 0,00</div><small id="pixDonoInfo"></small><br><small id="statusDono" style="background:#000;color:#22c55e;padding:8px 14px;border-radius:99px;font-weight:800;margin-top:10px;display:inline-block">⚠️ Ative o alarme</small></div>
<div class="card" style="border:3px solid #ef4444;background:#1a0a0a">
<h3>🚨 ALARME QUE TOCA NO WHATSAPP</h3>
<button class="btn btn-green" style="background:#22c55e;color:#000;font-size:16px;padding:18px;margin-top:8px" onclick="ativaSom()">🔊 ATIVAR ALARME FORTE</button>
<button class="btn btn-blue" style="background:#f59e0b;color:#000;margin-top:8px;padding:18px" onclick="ativarNotificacao()">🔔 ATIVAR NOTIFICAÇÃO</button>
<p id="debugSync" style="font-size:10px;color:#94a3b8;margin-top:8px;background:#0f172a;padding:8px;border-radius:6px;white-space:pre-wrap">Aguardando...</p>
<button onclick="simularPedido()" style="margin-top:8px;background:#334155;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-size:11px">🧪 SIMULAR PEDIDO TESTE</button>
</div>
<div class="card"><h3>🔔 PEDIDOS <span id="contadorPedidos" style="background:#22c55e;color:#000;padding:2px 8px;border-radius:99px">0</span></h3><div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn-red" onclick="limparTudo()">🗑️ LIMPAR HISTÓRICO</button></div><div id="listaPedidos"></div></div>
<div class="card" style="border:2px solid #22c55e;background:#052e16"><h3>⚙️ MEU PIX</h3><input id="cfgPixKey" class="inp" placeholder="Chave PIX: 30499462882"><input id="cfgPixName" class="inp" placeholder="Nome: TAKI"><input id="cfgPixCity" class="inp" placeholder="Cidade: SAO PAULO"><button class="btn btn-green" onclick="salvarPixConfig()">💾 SALVAR PIX</button></div>
<div class="card"><h3>🎼 Repertório</h3><div style="display:flex;gap:8px"><input id="novaMusica" class="inp" style="flex:2" placeholder="Música"><input id="novoCantor" class="inp" style="flex:1.5" placeholder="Cantor"></div><button class="btn btn-blue" style="width:100%" onclick="addMus()">+ ADICIONAR</button><div id="listaDono" style="margin-top:12px"></div></div>
<div class="card"><div class="qrWrap"><div style="font-weight:900">QR CODE CLIENTE</div><div id="qrcode" style="display:flex;justify-content:center;margin-top:8px"></div><p id="qrLink" style="font-size:8px;color:#64748b;word-break:break-all"></p></div></div>
</div>
<div id="pixModal" class="pixModal"><div class="pixCard"><h2 style="color:#16a34a">✅ Pedido enviado!</h2><h3 id="pixValorTxt" style="font-size:32px;color:#16a34a"></h3><p id="pixInfoTxt" style="font-size:12px;color:#334155;font-weight:700"></p><div id="pixQr" style="display:flex;justify-content:center;margin:14px 0"></div><div id="pixCopiaCola" class="pixCode"></div><button class="btn-green" onclick="copiarPix()">📋 COPIAR CODIGO PIX</button><button class="btn btn-ghost" style="width:100%;margin-top:8px;border:1px solid #ccc;color:#333" onclick="fecharPix()">Fechar</button></div></div>
<audio id="audioAlarme" preload="auto" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=notification-sound-7062.mp3"></audio>
<script>
let audioCtx=null,alarmeAtivo=false,notifAtiva=false,eventSource=null;
function initAudio(){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
function tocarAlarmeForte(){try{let a=document.getElementById("audioAlarme");a.currentTime=0;a.volume=1;a.play().catch(()=>{});}catch(e){}try{if(!audioCtx)initAudio();if(audioCtx){for(let i=0;i<6;i++){setTimeout(()=>{try{let o=audioCtx.createOscillator();let g=audioCtx.createGain();o.type='sine';o.frequency.value=880+i*120;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.6);o.start();o.stop(audioCtx.currentTime+0.6);}catch(e){}},i*250);}}if(navigator.vibrate)navigator.vibrate([500,200,500,200,1000]);}catch(e){}}
async function ativarNotificacao(){try{let perm=await Notification.requestPermission();if(perm!=='granted'){alert("Permita notificações!");return;}notifAtiva=true;localStorage.setItem("notif_ativa","1");if('serviceWorker' in navigator){try{let reg=await navigator.serviceWorker.ready;reg.showNotification("🔔 PEDE AÍ ATIVADO!",{body:"Show: "+(showAberto?"LIBERADO":"PAUSADO"),vibrate:[500,150,500],requireInteraction:true});}catch(e){}}document.getElementById("debugSync").innerText="✅ Notificação ativada!\n"+new Date().toLocaleTimeString();showTop("🔔 Ativado!");}catch(e){alert(e);}}
function notificarPedido(ped){if(!notifAtiva)return;try{navigator.serviceWorker.ready.then(reg=>{reg.showNotification("🔔 NOVO PEDIDO! "+ped.musica,{body:"De: "+ped.nome+" - "+ped.recado+" R$"+(ped.caixa||0),vibrate:[500,150,500,150,800],requireInteraction:true,tag:"pedido-"+ped.id});}).catch(()=>{});}catch(e){}}
let PIX_KEY=localStorage.getItem("taki_pix_key")||"30499462882";let PIX_NAME=localStorage.getItem("taki_pix_name")||"TAKI";let PIX_CITY=localStorage.getItem("taki_pix_city")||"SAO PAULO";
let showAberto=localStorage.getItem("show_aberto")!=="0";
const TOPIC="pedeai-taki-V30-FIX";const TOPIC_REP=TOPIC+"-REP";const TOPIC_PED=TOPIC+"-PED";const TOPIC_CFG=TOPIC+"-CFG";const TOPIC_SHOW=TOPIC+"-SHOW";
const isDono=new URLSearchParams(location.search).get("dono")==="TAKI123";
let rep=JSON.parse(localStorage.getItem("rep_v30")||"[]");if(rep.length===0){rep=[{id:1,musica:"METADE",cantor:"ADRIANA CALCANHOTO"}];}
let peds=JSON.parse(localStorage.getItem("peds_v30")||"[]");let sel=null,caixa=0,ultimoPix="";
function crc16(s){let crc=0xFFFF;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?(crc<<1)^0x1021:crc<<1}return(crc&0xFFFF).toString(16).toUpperCase().padStart(4,'0')}
function fmt(id,v){return id+String(v.length).padStart(2,'0')+v}
function genPix(k,amt,name,city,tx){try{let ck=String(k).trim().replace(/\s+/g,'');if(!ck)return "";let cn=String(name||"TAKI").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").trim().substring(0,25)||"TAKI";let cc=String(city||"SAO PAULO").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").trim().substring(0,15)||"SAO PAULO";let m=fmt("00","BR.GOV.BCB.PIX")+fmt("01",ck);let a=amt>0?fmt("54",Number(amt).toFixed(2)):"";let p=fmt("00","01")+fmt("01","12")+fmt("26",m)+fmt("52","0000")+fmt("53","986")+a+fmt("58","BR")+fmt("59",cn)+fmt("60",cc)+fmt("62",fmt("05",tx.substring(0,20)));p+="6304";return p+crc16(p);}catch(e){return "";}}
function save(){localStorage.setItem("rep_v30",JSON.stringify(rep));localStorage.setItem("peds_v30",JSON.stringify(peds));renderAll();}
function salvarPixConfig(){let k=document.getElementById("cfgPixKey").value.trim().replace(/\s/g,'');let n=document.getElementById("cfgPixName").value.trim()||"TAKI";let c=document.getElementById("cfgPixCity").value.trim()||"SAO PAULO";if(!k){alert("Digite PIX!");return;}localStorage.setItem("taki_pix_key",k);localStorage.setItem("taki_pix_name",n);localStorage.setItem("taki_pix_city",c);PIX_KEY=k;PIX_NAME=n;PIX_CITY=c;fetch("https://ntfy.sh/"+TOPIC_CFG,{method:"POST",body:JSON.stringify({key:k,name:n,city:c})}).then(()=>{alert("✅ PIX SALVO: "+k);renderAll();testarPix();});}
function testarPix(){if(!PIX_KEY){alert("Configure PIX!");return;}let t=genPix(PIX_KEY,5,PIX_NAME,PIX_CITY,"TESTE123");if(!t){alert("Erro PIX! Chave: "+PIX_KEY);return;}ultimoPix=t;document.getElementById("pixValorTxt").innerText="R$ 5,00 TESTE";document.getElementById("pixInfoTxt").innerText=PIX_KEY+" - "+PIX_NAME;document.getElementById("pixCopiaCola").innerText=ultimoPix;document.getElementById("pixQr").innerHTML="";try{new QRCode(document.getElementById("pixQr"),{text:ultimoPix,width:200,height:200})}catch(e){}document.getElementById("pixModal").style.display="flex";}
async function fetchConfig(){try{let r=await fetch("https://ntfy.sh/"+TOPIC_CFG+"/json?poll=1&cache="+Date.now(),{cache:"no-store"});let t=await r.text();let lines=t.trim().split("\n").filter(l=>l);if(lines.length){let last=JSON.parse(lines[lines.length-1]);if(last.message){let cfg=JSON.parse(last.message);if(cfg.key){PIX_KEY=cfg.key;PIX_NAME=cfg.name;PIX_CITY=cfg.city;localStorage.setItem("taki_pix_key",PIX_KEY);localStorage.setItem("taki_pix_name",PIX_NAME);localStorage.setItem("taki_pix_city",PIX_CITY);renderAll();}}}}catch(e){}}
async function fetchShowStatus(){try{let r=await fetch("https://ntfy.sh/"+TOPIC_SHOW+"/json?poll=1&cache="+Date.now(),{cache:"no-store"});let t=await r.text();let lines=t.trim().split("\n").filter(l=>l);if(lines.length){let last=JSON.parse(lines[lines.length-1]);if(last.message){let st=JSON.parse(last.message);showAberto=!!st.aberto;localStorage.setItem("show_aberto",showAberto?"1":"0");renderAll();}}}catch(e){}}
function toggleShow(){showAberto=!showAberto;localStorage.setItem("show_aberto",showAberto?"1":"0");fetch("https://ntfy.sh/"+TOPIC_SHOW+"?t="+Date.now(),{method:"POST",body:JSON.stringify({aberto:showAberto})});renderAll();if(showAberto){tocarAlarmeForte();showTop("🟢 LIBERADO!");}else{showTop("🔴 PAUSADO!");}}
function forcarSync(){showTop("🔄 Sincronizando...");fetchShowStatus();fetchRep();fetchConfig();fetchPedidosNow();if(isDono){fetch("https://ntfy.sh/"+TOPIC_SHOW+"?t="+Date.now(),{method:"POST",body:JSON.stringify({aberto:showAberto})});}}
function addMus(){let m=document.getElementById("novaMusica").value.trim();let c=document.getElementById("novoCantor").value.trim();if(!m)return;rep.push({id:Date.now(),musica:m.toUpperCase(),cantor:c.toUpperCase()});document.getElementById("novaMusica").value="";document.getElementById("novoCantor").value="";save();fetch("https://ntfy.sh/"+TOPIC_REP,{method:"POST",body:JSON.stringify(rep)});}
function editMus(id){let r=rep.find(x=>x.id===id);let nm=prompt("Editar:",r.musica);if(nm===null)return;let nc=prompt("Cantor:",r.cantor);if(nc===null)return;r.musica=nm.trim().toUpperCase();r.cantor=nc.trim().toUpperCase();save();fetch("https://ntfy.sh/"+TOPIC_REP,{method:"POST",body:JSON.stringify(rep)});}
function delMus(id){if(!confirm("Apagar?"))return;rep=rep.filter(r=>r.id!==id);save();fetch("https://ntfy.sh/"+TOPIC_REP,{method:"POST",body:JSON.stringify(rep)});}
async function fetchRep(){try{let r=await fetch("https://ntfy.sh/"+TOPIC_REP+"/json?poll=1&cache="+Date.now(),{cache:"no-store"});let t=await r.text();let lines=t.trim().split("\n").filter(l=>l);if(lines.length){let last=JSON.parse(lines[lines.length-1]);if(last.message){let remote=JSON.parse(last.message);if(Array.isArray(remote)&&remote.length>0){rep=remote;localStorage.setItem("rep_v30",JSON.stringify(rep));renderAll();}}}}catch(e){}}
function renderCli(){let b=(document.getElementById("busca").value||"").toLowerCase();let f=rep.filter(r=>(r.musica+" "+r.cantor).toLowerCase().includes(b));document.getElementById("listaCli").innerHTML=f.map(r=>`<div class="music" onclick="escolhe(${r.id})"><div><b>${r.musica}</b><br><small style="color:#94a3b8">${r.cantor}</small></div><span>🎵</span></div>`).join("")||"<p style='text-align:center;padding:20px;color:#64748b'>Nenhuma música</p>";let s=document.getElementById("cardStatusCli");if(!showAberto){s.style.display="block";s.style.background="#ef4444";s.innerHTML="🔴 SHOW PAUSADO";document.getElementById("formPedido").style.display="none";}else{s.style.display="block";s.style.background="#22c55e";s.style.color="#000";s.innerHTML="🟢 SHOW LIBERADO! PEDE AÍ! 🎵";}document.getElementById("pixPreview").style.display=caixa>0?"block":"none";if(caixa>0){document.getElementById("pixPreview").innerText=PIX_KEY?"✓ PIX R$ "+caixa+" para "+PIX_KEY:"✓ R$ "+caixa;}document.getElementById("btnEnviar").innerText=caixa>0&&PIX_KEY?"ENVIAR + PAGAR R$"+caixa:"ENVIAR PEDIDO";document.getElementById("btnEnviar").disabled=!showAberto;}
function renderDono(){document.getElementById("cfgPixKey").value=PIX_KEY;document.getElementById("cfgPixName").value=PIX_NAME;document.getElementById("cfgPixCity").value=PIX_CITY;document.getElementById("pixDonoInfo").innerText=PIX_KEY?"✅ PIX: "+PIX_KEY:"❌ Configure PIX";let box=document.getElementById("showStatusBox");let btn=document.getElementById("btnToggleShow");if(showAberto){box.innerHTML='<div class="showON">🟢 SHOW LIBERADO</div>';btn.innerText='🔴 PAUSAR';btn.style.background='#ef4444';}else{box.innerHTML='<div class="showOFF">🔴 SHOW PAUSADO</div>';btn.innerText='🟢 INICIAR SHOW';btn.style.background='#22c55e';btn.style.color='#000';}document.getElementById("listaDono").innerHTML=rep.map(r=>`<div style="padding:10px;border-bottom:1px solid #334155;display:flex;justify-content:space-between"><div><b>${r.musica}</b><br><small>${r.cantor}</small></div><div><button style="background:#334155;color:#fff;border:none;padding:6px 10px;border-radius:8px" onclick="editMus(${r.id})">✏️</button><button style="background:#ef4444;color:#fff;border:none;padding:6px 10px;border-radius:8px;margin-left:4px" onclick="delMus(${r.id})">🗑️</button></div></div>`).join("");let tot=peds.reduce((s,p)=>s+(p.caixa||0),0);document.getElementById("totalCaixa").innerText="R$ "+tot+",00";document.getElementById("contadorPedidos").innerText=peds.length;document.getElementById("listaPedidos").innerHTML=peds.slice().reverse().map(p=>`<div style="background:#0f172a;border:3px solid #22c55e;border-radius:12px;padding:12px;margin:8px 0"><b style="color:#22c55e">${p.musica}</b> ${p.caixa>0?`<span style="background:#22c55e;color:#000;padding:4px 10px;border-radius:999px">R$${p.caixa}</span>`:``}<br>👤 <b>${p.nome}</b>: "${p.recado}"<br><small>${new Date(p.data).toLocaleString('pt-BR')}</small></div>`).join("")||"<p style='color:#64748b;text-align:center;padding:20px'>Nenhum pedido</p>";}
function renderAll(){let base=location.href.split("?")[0];if(isDono){document.getElementById("vCli").style.display="none";document.getElementById("vDono").style.display="block";document.getElementById("topSub").innerText="DONO V30 - "+rep.length+" músicas";try{document.getElementById("qrcode").innerHTML="";new QRCode(document.getElementById("qrcode"),{text:base,width:180,height:180});document.getElementById("qrLink").innerText=base;}catch(e){}}else{document.getElementById("vCli").style.display="block";document.getElementById("vDono").style.display="none";document.getElementById("topSub").innerText=rep.length+" músicas";}renderCli();if(isDono)renderDono();}
function escolhe(id){if(!showAberto){alert("Pausado!");return;}sel=rep.find(r=>r.id===id);document.getElementById("musicaSelTxt").innerText=sel.musica;document.getElementById("cantorSelTxt").innerText=sel.cantor;document.getElementById("formPedido").style.display="block";document.getElementById("formPedido").scrollIntoView({behavior:"smooth"});}
function setCaixa(v){caixa=v;document.querySelectorAll(".cal").forEach(el=>el.classList.remove("on"));let el=document.getElementById("c"+v);if(el)el.classList.add("on");document.getElementById("outroValor").value="";renderCli();}
function setCaixaCustom(v){let num=parseInt(v)||0;if(num>0){caixa=num;document.querySelectorAll(".cal").forEach(el=>el.classList.remove("on"));renderCli();}else if(v===""){caixa=0;document.querySelectorAll(".cal").forEach(el=>el.classList.remove("on"));renderCli();}}
function aplicarOutro(){let v=document.getElementById("outroValor").value;setCaixaCustom(v);if(caixa>0)showTop("✅ R$"+caixa+"!");}
function showTop(t){let el=document.getElementById("alertTop");el.innerText=t;el.style.display="block";setTimeout(()=>el.style.display="none",4000)}
async function syncPed(p){try{let res=await fetch("https://ntfy.sh/"+TOPIC_PED,{method:"POST",body:JSON.stringify(p)});console.log("Enviado",res.status);return true;}catch(e){return false;}}
function enviar(){if(!showAberto){alert("Pausado!");return;}let nome=document.getElementById("nomeCli").value.trim()||"Anônimo";let rec=document.getElementById("recadoCli").value.trim()||"Sem recado";if(!sel){alert("Escolha música!");return;}let btn=document.getElementById("btnEnviar");btn.innerText="⏳ Enviando...";btn.disabled=true;let ped={id:Date.now(),musica:sel.musica,cantor:sel.cantor,nome,recado:rec,caixa,data:new Date().toISOString()};peds.push(ped);save();syncPed(ped).then(()=>{btn.disabled=false;renderCli();if(caixa>0&&PIX_KEY){ultimoPix=genPix(PIX_KEY,caixa,PIX_NAME,PIX_CITY,"TAKI"+Date.now().toString().slice(-6));if(!ultimoPix){alert("Pedido enviado! Mas erro no PIX, avise o músico");fecharPix();return;}document.getElementById("pixValorTxt").innerText="R$ "+caixa+",00";document.getElementById("pixInfoTxt").innerText=PIX_KEY+" - "+PIX_NAME;document.getElementById("pixCopiaCola").innerText=ultimoPix;document.getElementById("pixQr").innerHTML="";try{new QRCode(document.getElementById("pixQr"),{text:ultimoPix,width:200,height:200})}catch(e){}document.getElementById("pixModal").style.display="flex";}else{showTop("✅ Pedido enviado! "+sel.musica);fecharPix();}});}
function copiarPix(){if(!ultimoPix){alert("Nada!");return;}navigator.clipboard.writeText(ultimoPix).then(()=>{showTop("✅ COPIADO!");alert("✅ COPIADO! Abra seu banco > PIX Copia e Cola");}).catch(()=>{prompt("Copie:",ultimoPix);});}
function fecharPix(){document.getElementById("pixModal").style.display="none";document.getElementById("formPedido").style.display="none";document.getElementById("nomeCli").value="";document.getElementById("recadoCli").value="";setCaixa(0);document.getElementById("outroValor").value="";sel=null;}
function ativaSom(){initAudio();try{document.getElementById("audioAlarme").play().then(()=>{document.getElementById("audioAlarme").pause();document.getElementById("audioAlarme").currentTime=0;}).catch(()=>{});}catch(e){}tocarAlarmeForte();alarmeAtivo=true;localStorage.setItem("alarme_ativo","1");showTop("🔊 ALARME ATIVADO!");document.getElementById("statusDono").innerText="🔊 ATIVO";document.getElementById("statusDono").style.background="#22c55e";document.getElementById("statusDono").style.color="#000";startEventSource();}
function startEventSource(){if(eventSource)eventSource.close();try{eventSource=new EventSource("https://ntfy.sh/"+TOPIC_PED+"/sse?since=10m");eventSource.onmessage=(e)=>{try{let outer=JSON.parse(e.data);if(outer.message){let ped=JSON.parse(outer.message);if(ped.musica&&ped.id&&!peds.find(x=>x.id===ped.id)){peds.push(ped);save();tocarAlarmeForte();notificarPedido(ped);showTop("🔔 NOVO! "+ped.musica);}}}catch(err){}};eventSource.onopen=()=>{document.getElementById("debugSync").innerText="✅ AO VIVO! Aguardando...\n"+new Date().toLocaleTimeString();};eventSource.onerror=()=>{setTimeout(startEventSource,3000);};}catch(e){setInterval(fetchPedidosNow,2000);}}
async function fetchPedidosNow(){try{let r=await fetch("https://ntfy.sh/"+TOPIC_PED+"/json?poll=1&since=10m&cache="+Date.now(),{cache:"no-store"});let t=await r.text();let lines=t.trim().split("\n").filter(l=>l);let novos=0;lines.forEach(line=>{try{let j=JSON.parse(line);if(j.message){let p=JSON.parse(j.message);if(p.musica&&p.id&&!peds.find(x=>x.id===p.id)){peds.push(p);novos++;if(alarmeAtivo){tocarAlarmeForte();notificarPedido(p);}}}}catch(e){}});if(novos>0){save();showTop("🔔 "+novos+" novo(s)!");}}catch(e){}}
function simularPedido(){let f={id:Date.now(),musica:"METADE TESTE",cantor:"ADRIANA",nome:"Teste",recado:"Teste",caixa:5,data:new Date().toISOString()};peds.push(f);save();tocarAlarmeForte();showTop("🧪 TESTE: "+f.musica);}
function limparTudo(){if(confirm("Limpar tudo?")){if(confirm("Confirma?")){peds=[];save();showTop("🗑️ Limpo!");renderAll();}}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
if(localStorage.getItem("notif_ativa")==="1"){notifAtiva=true;}
renderAll();fetchRep();fetchConfig();fetchShowStatus();
if(isDono){startEventSource();setInterval(fetchPedidosNow,2000);setInterval(fetchShowStatus,2000);}else{setInterval(fetchRep,3000);setInterval(fetchConfig,3000);setInterval(fetchShowStatus,2000);}
</script>
</body>
