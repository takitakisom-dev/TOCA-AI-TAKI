<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEDE AI - dim dim</title>
<link id="manifestLink" rel="manifest" href="">
<meta name="theme-color" content="#22c55e">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:Inter,system-ui,sans-serif;min-height:100vh}
.hero{padding:24px;text-align:center}
.hero h1{font-size:42px;font-weight:900}.hero h1 span{color:#22c55e}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:999px;border:0;font-weight:800;cursor:pointer;font-size:14px}
.btn-green{background:#22c55e;color:#000}.btn-dark{background:#1a1a23;color:#fff;border:1px solid #2a2a35}.btn-red{background:#ff3b3b;color:#fff}
.card{background:#15151f;border:1px solid #23232f;border-radius:20px;padding:18px;margin:12px 0}
input,select,textarea{width:100%;padding:14px;border-radius:12px;border:1px solid #2a2a35;background:#0f0f18;color:#fff;font-size:15px;margin-top:8px}
#pageCliente,#pageDono{display:none}
.install-box{background:linear-gradient(135deg,#22c55e,#16a34a);color:#000;border-radius:20px;padding:20px;text-align:center;margin:16px 0}
.song{padding:14px;border-bottom:1px solid #23232f;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.badge{background:#22c55e;color:#000;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:800}
.rep-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #23232f}
.rep-item button{background:#ff4444;color:#fff;border:0;border-radius:8px;padding:6px 10px}
.alerta{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:16px 24px;border-radius:16px;font-weight:900;z-index:99999;display:none;box-shadow:0 10px 30px #000}
.status-on{background:#22c55e;color:#000;padding:8px 16px;border-radius:999px;font-weight:900;font-size:13px}
.status-off{background:#ff3b3b;color:#fff;padding:8px 16px;border-radius:999px;font-weight:900;font-size:13px}
</style>
</head>
<body>
<div id="alertaSom" class="alerta">🔔 NOVO PEDIDO!</div>
<div id="pageLanding">
<div class="hero">
<h1>PEDE <span>AI</span> 🎸</h1>
<p style="opacity:.7">Transforme pedidos em <b>dim,dim💰</b></p>
<div class="card" style="max-width:440px;margin:20px auto;text-align:left">
<h3 style="text-align:center">🎤 Criar seu link</h3>
<input id="nomeCantor" placeholder="🎤 Nome artístico (ex: André Barreto)">
<input id="pixCantor" placeholder="🔑 Chave PIX">
<input id="nomePix" placeholder="👤 Nome no PIX">
<button class="btn btn-green" style="width:100%;margin-top:14px;padding:16px;font-size:16px" onclick="criarLink()">CRIAR MEU LINK GRÁTIS</button>
<button class="btn btn-dark" style="width:100%;margin-top:10px;padding:14px;font-size:14px" onclick="entrarPainel()">🔑 JÁ TENHO LINK - ENTRAR</button>
<p id="linkGerado" style="margin-top:14px;word-break:break-all;font-size:13px;text-align:center"></p>
<div id="botoesPosCadastro" style="display:none;margin-top:12px">
<button class="btn btn-green" style="width:100%;padding:16px;font-size:16px" onclick="entrarPainel()">➡️ ENTRAR NO MEU PAINEL</button>
</div>
</div>
</div>
</div>
