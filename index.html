<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STAGEFLOW PRO - FINAL PERFEITO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{display:flex;background:#fff;min-height:100vh}
.sidebar{width:260px;background:#10101E;color:#fff;position:fixed;left:-280px;top:0;height:100vh;padding:16px 12px;z-index:2000;display:flex;flex-direction:column;transition:.3s}
.sidebar.show{left:0}
.logo{font-weight:800;font-size:18px;margin-bottom:20px}
.menu button{width:100%;padding:11px;border:none;border-radius:8px;background:transparent;color:#9AA0B4;text-align:left;font-weight:600;margin-bottom:2px;cursor:pointer}
.menu button.active{background:#7C5CFC;color:#fff}
.main{flex:1;min-width:0;background:#fff}
.top{padding:10px 12px;display:flex;gap:8px;align-items:center;background:#10101E;position:sticky;top:0;z-index:1000}
.top .hamb{background:#fff;color:#10101E;border:none;width:44px;height:44px;border-radius:8px;font-size:22px;font-weight:900;cursor:pointer}
.top .titulo{color:#fff;font-weight:800;flex:1;font-size:14px}
.top button.action{padding:10px 14px;border:none;border-radius:8px;background:#fff;font-weight:800;cursor:pointer;font-size:12px}
.header{background:#3D3D3D;color:#fff;padding:14px 18px;font-size:20px;font-weight:900;letter-spacing:.5px}
.wrap{overflow-x:auto}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:10px 12px;background:#F5F5F5;min-width:800px}
.week div{background:#E9E9E9;padding:12px 0;text-align:center;font-weight:700;font-size:13px;border-radius:4px;color:#333}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:0 12px 20px;background:#F5F5F5;min-width:800px}
.cell{background:#fff;border:1.2px solid #999;border-radius:6px;padding:8px 6px;min-height:145px}
.cell.empty{background:#EFEFEF;border-color:#DDD}
.num{font-size:22px;font-weight:900;color:#0B3D91;display:flex;align-items:center;gap:4px;margin-bottom:4px}
.num span{font-size:12px}
.linha{font-size:9.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#222}
.linha select{border:none;background:transparent;width:100%;font-size:9.5px;font-weight:600;cursor:pointer;color:#222}

@media(min-width:901px){.sidebar{left:0}.main{margin-left:260px}.top .hamb{display:none}}
@media(max-width:900px){
.wrap{overflow-x:auto}
.week,.cal{min-width:700px}
.cell{min-height:135px}
}
@media print{
@page{size:A4 landscape;margin:8mm}
.sidebar,.top{display:none!important}
.main{margin-left:0!important}
.wrap{overflow:visible}
.week,.cal{min-width:0}
.cell{min-height:110px}
}
</style>
</head>
<body>
<div class="sidebar" id="side">
<div class="logo">Stageflow Pro</div>
<div class="menu">
<button>Dashboard</button>
<button class="active">Agendamento Mensal</button>
<button>Artistas</button>
<button>Casas</button>
<button>Financeiro</button>
<button>Relatorios</button>
<button>Configuracoes</button>
<div style="margin-top:12px;display:flex;gap:6px">
<button style="background:#2A2A3A;color:#fff" onclick="exportar()">Exportar</button>
<button style="background:#2A2A3A;color:#fff" onclick="document.getElementById('imp').click()">Importar</button>
<input type="file" id="imp" hidden accept=".json" onchange="importar(this)">
</div>
</div>
<div style="margin-top:auto;background:#1A1A2E;padding:10px;border-radius:10px;font-size:12px">JD - Joao Duarte - Admin</div>
</div>

<div class="main">
<div class="top">
<button class="hamb" onclick="document.getElementById('side').classList.toggle('show')">☰</button>
<div class="titulo">STAGEFLOW PRO</div>
<button class="action" onclick="window.print()">Imprimir Horizontal</button>
<button class="action" onclick="exportar()">Exportar</button>
</div>
<div class="header">STAGEFLOW PRO • CALENDÁRIO NOVEMBRO 2026</div>
<div class="wrap">
<div class="week"><div>Domingo</div><div>Segunda</div><div>Terça</div><div>Quarta</div><div>Quinta</div><div>Sexta</div><div>Sábado</div></div>
<div class="cal" id="cal"></div>
</div>
</div>

<script>
const opcoes=["Cais - Eli","Vila Chopp - Grill","Grill - Luciano","Bar do Zé - Y Gon","Omau - Vago","Vago - Israel"];
let base={}; for(let i=1;i<=30;i++) base[i]=["Cais - Eli","Vila Chopp - Grill","Grill - Luciano","Bar do Zé - Y Gon","Omau - Vago","Vago - Israel"];
let dados=JSON.parse(localStorage.getItem('stageflow_final_perfeito')||'null')||base;
function opts(v){return opcoes.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}
function render(){
const cal=document.getElementById('cal'); cal.innerHTML='';
for(let dia=1;dia<=30;dia++){
let a=dados[dia];
let el=document.createElement('div');el.className='cell';
el.innerHTML=`<div class="num">${dia} <span>▼</span></div>
<div class="linha"><b>P1:</b> <select data-d="${dia}" data-i="0">${opts(a[0])}</select></div>
<div class="linha"><b>P2:</b> <select data-d="${dia}" data-i="1">${opts(a[1])}</select></div>
<div class="linha"><b>P3:</b> <select data-d="${dia}" data-i="2">${opts(a[2])}</select></div>
<div class="linha"><b>P4:</b> <select data-d="${dia}" data-i="3">${opts(a[3])}</select></div>
<div class="linha"><b>P5:</b> <select data-d="${dia}" data-i="4">${opts(a[4])}</select></div>
<div class="linha"><b>P6:</b> <select data-d="${dia}" data-i="5">${opts(a[5])}</select></div>`;
cal.appendChild(el);
}
for(let i=0;i<5;i++){let e=document.createElement('div');e.className='cell empty';cal.appendChild(e);}
cal.querySelectorAll('select').forEach(s=>s.addEventListener('change',e=>{
dados[e.target.dataset.d][e.target.dataset.i]=e.target.value;
localStorage.setItem('stageflow_final_perfeito',JSON.stringify(dados));
}));
}
render();
function exportar(){let a=document.createElement('a');a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(dados));a.download="stageflow-novembro-2026.json";a.click()}
function importar(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{localStorage.setItem('stageflow_final_perfeito',e.target.result);location.reload()};r.readAsText(f)}
</script>
</body>
</html>
