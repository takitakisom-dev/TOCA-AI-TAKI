<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>STAGEFLOW PRO - 30 DIAS VISAO GERAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{display:flex;background:#fff;min-height:100vh}
.sidebar{width:250px;background:#10101E;color:#fff;position:fixed;left:0;top:0;height:100vh;padding:16px 12px;z-index:1000;display:flex;flex-direction:column;transition:.25s}
.logo{font-weight:800;margin-bottom:20px}
.menu{flex:1}
.menu button{width:100%;padding:11px 12px;margin-bottom:2px;border:none;border-radius:8px;background:transparent;color:#9AA0B4;text-align:left;font-weight:600;font-size:13px;cursor:pointer}
.menu button.active{background:#7C5CFC;color:#fff}
.main{margin-left:250px;flex:1;min-width:0}
.top{padding:10px 14px;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;position:sticky;top:0;z-index:10}
.top button{padding:10px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;font-weight:700;cursor:pointer;font-size:12px}
.btn-menu{display:none;background:#10101E;color:#fff;border:none;width:40px;height:40px;border-radius:8px;font-size:22px}
.header{background:#3A3A3A;color:#fff;padding:16px 20px;font-size:22px;font-weight:900}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px 12px;background:#fff}
.week div{background:#E9E9E9;padding:8px 0;text-align:center;font-weight:700;font-size:12px;border-radius:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;padding:0 12px 20px;background:#fff}
.cell{border:1.2px solid #333;background:#fff;min-height:175px;padding:8px 6px;border-radius:5px;overflow:hidden}
.cell.empty{background:#EDEDED;border-color:#ccc;min-height:40px}
.num{font-size:18px;font-weight:900;color:#1E3A8A;margin-bottom:5px}
.linha{font-size:10.5px;display:flex;gap:2px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linha b{min-width:20px;font-weight:800}
.linha select{border:none;background:transparent;width:100%;font-size:10.5px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* MOBILE - AGORA MOSTRA OS 30 DIAS DE UMA VEZ, 7 COLUNAS */
@media(max-width:900px){
.sidebar{left:-260px}.sidebar.show{left:0}
.main{margin-left:0}
.btn-menu{display:block}
.header{font-size:16px;padding:12px}
.week{gap:4px;padding:6px}
.week div{font-size:9px;padding:6px 0}
.cal{gap:4px;padding:0 6px 12px}
.cell{min-height:155px;padding:5px 4px}
.num{font-size:14px;margin-bottom:3px}
.linha{font-size:8.5px;line-height:1.25}
.linha select{font-size:8.5px}
}

@media print{
@page{size:A4 landscape;margin:6mm}
.sidebar,.top{display:none!important}
.main{margin-left:0!important}
.cell{min-height:110px!important}
.linha,.linha select{font-size:8px!important}
}
</style>
</head>
<body>
<div class="sidebar" id="side">
<div class="logo">Stageflow Pro</div>
<div class="menu">
<button>Dashboard</button>
<button class="active">Agendamento Mensal</button>
<button>Artistas</button>
<button>Casas</button>
<button>Financeiro</button>
<button>Relatorios</button>
<div style="margin-top:12px;display:flex;gap:6px">
<button style="background:#2A2A3A;color:#fff" onclick="exportar()">Exportar</button>
<button style="background:#2A2A3A;color:#fff" onclick="document.getElementById('f').click()">Importar</button>
<input type="file" id="f" hidden accept=".json" onchange="importar(this)">
</div>
</div>
<div style="margin-top:auto;background:#1A1A2E;padding:10px;border-radius:10px;font-size:12px">JD - Joao Duarte</div>
</div>

<div class="main">
<div class="top">
<button class="btn-menu" onclick="document.getElementById('side').classList.toggle('show')">☰</button>
<button onclick="window.print()">Imprimir Horizontal 30 Dias</button>
<button onclick="exportar()">Exportar</button>
</div>
<div class="header">STAGEFLOW PRO - CALENDARIO NOVEMBRO 2026 - SEGUNDA A DOMINGO</div>
<div class="week"><div>SEGUNDA</div><div>TERCA</div><div>QUARTA</div><div>QUINTA</div><div>SEXTA</div><div>SABADO</div><div>DOMINGO</div></div>
<div class="cal" id="cal"></div>
</div>

<script>
const opcoes=["Cais - Eli","Vila Chopp - Grill","Grill - Luciano","Bar do Ze - Y Gon","Omau - Vago","Vago - Israel"];
let base={}; for(let i=1;i<=30;i++) base[i]=["Cais - Eli","Vila Chopp - Grill","Grill - Luciano","Bar do Ze - Y Gon","Omau - Vago","Vago - Israel"];
let dados=JSON.parse(localStorage.getItem('stageflow_30dias_visao')||'null')||base;
function opts(v){return opcoes.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}
const cal=document.getElementById('cal');
function desenhar(){
cal.innerHTML='';
// Novembro 2026 comeca domingo, entao 6 vazios pra comecar na segunda
for(let i=0;i<6;i++){let d=document.createElement('div');d.className='cell empty';cal.appendChild(d);}
for(let dia=1;dia<=30;dia++){
let a=dados[dia];
let el=document.createElement('div');el.className='cell';
el.innerHTML=`<div class="num">${dia}</div>
<div class="linha"><b>P1:</b><select data-d="${dia}" data-i="0">${opts(a[0])}</select></div>
<div class="linha"><b>P2:</b><select data-d="${dia}" data-i="1">${opts(a[1])}</select></div>
<div class="linha"><b>P3:</b><select data-d="${dia}" data-i="2">${opts(a[2])}</select></div>
<div class="linha"><b>P4:</b><select data-d="${dia}" data-i="3">${opts(a[3])}</select></div>
<div class="linha"><b>P5:</b><select data-d="${dia}" data-i="4">${opts(a[4])}</select></div>
<div class="linha"><b>P6:</b><select data-d="${dia}" data-i="5">${opts(a[5])}</select></div>`;
cal.appendChild(el);
}
cal.querySelectorAll('select').forEach(s=>s.addEventListener('change',e=>{
dados[e.target.dataset.d][e.target.dataset.i]=e.target.value;
localStorage.setItem('stageflow_30dias_visao',JSON.stringify(dados));
}));
}
desenhar();
function exportar(){let a=document.createElement('a');a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(dados));a.download="stageflow-novembro-2026.json";a.click();}
function importar(inp){let file=inp.files[0];if(!file)return;let r=new FileReader();r.onload=e=>{localStorage.setItem('stageflow_30dias_visao',e.target.result);location.reload()};r.readAsText(file)}
</script>
</body>
</html>
