<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEDE AI</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>body{background:#000;color:#fff;font-family:Arial;padding:10px} h2{color:#00ff88;text-align:center} #busca{width:100%;padding:14px;border-radius:12px;border:none} .musica{background:#1e1e1e;padding:12px;margin:6px 0;border-radius:10px;display:flex;justify-content:space-between} .musica button{background:#00ff88;border:none;padding:8px 14px;border-radius:20px;font-weight:bold}</style>
</head>
<body>
<h2 id="titulo">🎶 Carregando repertório...</h2>
<input id="busca" placeholder="🔍 Buscar música..." onkeyup="filtrar()">
<div id="lista"></div>
<script>
const firebaseConfig={apiKey:"AIzaSyD8JftaM8BwYLKa_3TAjHqN1ub151Myvgo",authDomain:"pede-ai-pro.firebaseapp.com",databaseURL:"https://pede-ai-pro-default-rtdb.firebaseio.com",projectId:"pede-ai-pro",storageBucket:"pede-ai-pro.firebasestorage.app",messagingSenderId:"549558191964",appId:"1:549558191964:web:40614401989e404af6a399"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
const id=new URLSearchParams(window.location.search).get('c');
let rep=[]; let fone="553499462882"; let nome="";
if(!id){document.getElementById('titulo').innerText="QR Inválido";}
else{
 db.ref('empresas/'+id).once('value').then(s=>{
  let d=s.val(); if(!d){document.getElementById('titulo').innerText="Repertório não encontrado - peça pro cantor clicar em SALVAR E ATUALIZAR NUVEM"; return;}
  if(d.showLiberado===false){document.getElementById('titulo').innerText="⏸️ Show pausado no momento"; document.getElementById('lista').innerHTML="<p style='text-align:center'>Volte em instantes!</p>"; return;}
  rep=d.repertorio||[]; fone=d.fone; nome=d.nome; document.getElementById('titulo').innerText="🎶 "+nome+" - PEDE AI"; mostrar(rep);
 });
}
function mostrar(l){let div=document.getElementById('lista'); div.innerHTML=""; l.forEach(m=>{let safe=m.replace(/'/g,"\\'"); div.innerHTML+=`<div class="musica"><span>${m}</span><button onclick="pedir('${safe}')">PEDIR</button></div>`;});}
function filtrar(){let t=document.getElementById('busca').value.toLowerCase(); mostrar(rep.filter(m=>m.toLowerCase().includes(t)));}
function pedir(musica){
 const id=new URLSearchParams(window.location.search).get('c');
 db.ref('empresas/'+id+'/pedidos').push({musica,cliente:"Cliente",hora:new Date().toLocaleString()});
 window.open(`https://wa.me/${fone}?text=${encodeURIComponent("Olá! Quero pedir: "+musica+" - via PEDE AI PRO")}`);
 alert("✅ Pedido enviado! "+musica);
}
</script>
</body>
</html>
