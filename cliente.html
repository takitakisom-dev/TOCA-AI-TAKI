<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEDE AI PRO</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial;display:flex;height:100vh}
.esq{width:55px;background:#000;display:flex;justify-content:center;align-items:center;writing-mode:vertical-rl;color:#00ff88;font-weight:bold;letter-spacing:2px}
.dir{flex:1;padding:10px;overflow-y:auto}
.caixa{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.caixa button{padding:8px 12px;border-radius:20px;border:2px solid #00ff88;background:#1a1a1a;color:#fff;font-weight:bold}
.caixa button.ativo{background:#00ff88;color:#000}
.musica{background:#1e1e1e;padding:12px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;margin:6px 0}
.musica .btns{display:flex;gap:6px}
.btn-pedir{background:#fff;color:#000;border:none;padding:8px 12px;border-radius:20px;font-weight:bold}
.btn-caixa{background:#00ff88;color:#000;border:none;padding:8px 12px;border-radius:20px;font-weight:bold}
#recadoBox{background:#1a1a1a;padding:10px;border-radius:12px;margin-top:10px}
input,textarea{width:100%;padding:10px;border-radius:10px;border:none;margin:4px 0;box-sizing:border-box}
</style>
</head>
<body>
<div class="esq" id="nomeEsq">PEDE AI</div>
<div class="dir">
<h3 id="titulo" style="color:#00ff88">Carregando...</h3>
<div class="caixa" id="caixaBtns">
<button class="ativo" data-v="LIVRE" onclick="selCaixa(this)">LIVRE</button>
<button data-v="2" onclick="selCaixa(this)">R$2</button>
<button data-v="5" onclick="selCaixa(this)">R$5</button>
<button data-v="10" onclick="selCaixa(this)">R$10</button>
<button data-v="20" onclick="selCaixa(this)">R$20</button>
<button data-v="50" onclick="selCaixa(this)">R$50</button>
</div>
<input id="busca" placeholder="🔍 Buscar música..." onkeyup="filtrar()">
<div id="lista"></div>
<div id="recadoBox">
<b>💬 Recado + PIX do artista</b>
<textarea id="recado" rows="2" placeholder="Seu recado..."></textarea>
<input id="nomeCli" placeholder="Seu nome">
<small id="pixInfo" style="color:#00ff88"></small>
</div>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyD8JftaM8BwYLKa_3TAjHqN1ub151Myvgo",authDomain:"pede-ai-pro.firebaseapp.com",databaseURL:"https://pede-ai-pro-default-rtdb.firebaseio.com",projectId:"pede-ai-pro",storageBucket:"pede-ai-pro.firebasestorage.app",messagingSenderId:"549558191964",appId:"1:549558191964:web:40614401989e404af6a399"};
firebase.initializeApp(firebaseConfig); const db=firebase.database();
let rep=[], fone="", pix="", valor="LIVRE";
const id=new URLSearchParams(window.location.search).get('c');
function selCaixa(el){document.querySelectorAll('.caixa button').forEach(b=>b.classList.remove('ativo')); el.classList.add('ativo'); valor=el.dataset.v; document.getElementById('pixInfo').innerText=`PIX: ${pix} | Valor selecionado: R$${valor}`;}
function carregar(){
 db.ref('empresas/'+id).once('value').then(s=>{
  let d=s.val(); if(!d){document.getElementById('titulo').innerText="Repertório não encontrado"; return;}
  rep=d.repertorio||[]; fone=d.fone; pix=d.pix||""; document.getElementById('titulo').innerText=`🎶 ${d.nome||d.nomeCompleto} - ${rep.length} músicas`;
  document.getElementById('nomeEsq').innerText=`PEDE AI - ${d.nome||'ANDRÉ TAKI'}`;
  document.getElementById('pixInfo').innerText=`PIX do ${d.nome}: ${pix} | Toque em PEDIR`;
  mostrar(rep);
 });
}
function mostrar(l){let div=document.getElementById('lista'); div.innerHTML=""; l.forEach(m=>{let safe=m.replace(/'/g,"\\'"); div.innerHTML+=`<div class="musica"><span>${m}</span><div class="btns"><button class="btn-pedir" onclick="pedirMusica('${safe}',false)">🎵 PEDIR</button><button class="btn-caixa" onclick="pedirMusica('${safe}',true)">💰 CAIXINHA</button></div></div>`});}
function filtrar(){let t=document.getElementById('busca').value.toLowerCase(); mostrar(rep.filter(m=>m.toLowerCase().includes(t)));}
function pedirMusica(musica,comCaixinha){
 let rec=document.getElementById('recado').value; let nome=document.getElementById('nomeCli').value||"Cliente";
 db.ref('empresas/'+id+'/pedidos').push({musica,valor:comCaixinha?valor:"GRÁTIS",recado:rec,nome,hora:new Date().toLocaleString()});
 if(comCaixinha){
  let msg=`Olá! Sou ${nome}. Pedido com CAIXINHA: ${musica} - Valor R$${valor} - Recado: ${rec} - PIX: ${pix}`;
  window.open(`https://wa.me/${fone}?text=${encodeURIComponent(msg)}`,'_blank');
  alert(`💰 Caixinha R$${valor} - PIX: ${pix} - Copia e manda!`);
 } else {
  let msg=`Olá! Sou ${nome}. Quero pedir a música: ${musica} - Recado: ${rec} - Via PEDE AI PRO (sem caixinha)`;
  window.open(`https://wa.me/${fone}?text=${encodeURIComponent(msg)}`,'_blank');
  alert(`🎵 Música pedida SEM caixinha: ${musica}`);
 }
}
carregar();
</script>
</body>
</html>
